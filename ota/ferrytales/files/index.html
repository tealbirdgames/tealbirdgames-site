Object.assign(DICT,{"Eyfel Kulesi":"Eiffel Tower","Demir dantelli dev kule":"The giant iron-lace tower","1889 Dünya Fuarı için yapıldı ve 41 yıl boyunca dünyanın en yüksek yapısı oldu. Paslanmasın diye her 7 yılda bir yaklaşık 60 ton boyayla baştan boyanır.":"Built for the 1889 World's Fair, it was the tallest structure in the world for 41 years. Every 7 years it is repainted with about 60 tonnes of paint so it won't rust.",
"Notre-Dame Katedrali":"Notre-Dame Cathedral","Seine adasındaki Gotik katedral":"The Gothic cathedral on a Seine island","Yapımı 1163'te başladı ve yaklaşık 200 yıl sürdü. 2019'daki büyük yangından sonra restore edildi ve 2024'te kapılarını yeniden açtı.":"Construction began in 1163 and took about 200 years. After the big fire in 2019 it was restored and reopened its doors in 2024.",
"Zafer Takı":"Arc de Triomphe","12 caddenin buluştuğu dev kemer":"The giant arch where 12 avenues meet","Napolyon 1806'da yaptırmaya başladı, 1836'da tamamlandı. Çevresindeki meydanda 12 büyük cadde tek bir noktada buluşur ve yukarıdan bakınca bir yıldıza benzer.":"Napoleon ordered it in 1806 and it was finished in 1836. Twelve big avenues meet around it, and from above they look like a star.",
"Louvre Müzesi":"Louvre Museum","Cam piramitli saray müzesi":"The palace museum with a glass pyramid","Eskiden bir kraliyet sarayıydı, 1793'te müze oldu. Mona Lisa burada sergilenir. Avludaki cam piramit 1989'da eklendi.":"It used to be a royal palace and became a museum in 1793. The Mona Lisa is displayed here. The glass pyramid in the courtyard was added in 1989.",
"Sacré-Cœur Bazilikası":"Sacré-Cœur Basilica","Montmartre tepesinin beyaz kubbesi":"The white dome on Montmartre hill","Paris'in en yüksek tepesi Montmartre'nin üstünde durur. Taşları yağmur yağdıkça kendini temizler ve bu yüzden hep bembeyaz görünür.":"It stands on Montmartre, the highest hill in Paris. Its stones clean themselves when it rains, so it always looks bright white.",
"Moulin Rouge":"Moulin Rouge","Kırmızı yel değirmenli meşhur sahne":"The famous stage with a red windmill","1889'da açıldı. Çatısındaki kırmızı yel değirmeni şehrin simgelerinden biri oldu ve ünlü kankan dansı burada dünyaya yayıldı.":"It opened in 1889. The red windmill on its roof became a city icon, and the famous cancan dance spread to the world from here.",
"Alexandre III Köprüsü":"Pont Alexandre III","Altın heykelli süslü köprü":"The ornate bridge with golden statues","1900 Dünya Fuarı için açıldı. Seine'i tek kemerle geçer ve dört köşesindeki altın kanatlı at heykelleriyle Paris'in en süslü köprüsüdür.":"It opened for the 1900 World's Fair. It crosses the Seine in a single arch and its golden winged horses make it the most ornate bridge in Paris.",
"Seine Sahafları":"Seine Booksellers","Nehir kıyısındaki yeşil kitap kutuları":"Green book boxes along the river","1500'lerden beri Seine kıyısında kitap satılıyor. Bugün 200'den fazla sahaf, taş korkuluğa asılı yeşil kutularda yüz binlerce eski kitap satıyor.":"Books have been sold along the Seine since the 1500s. Today more than 200 booksellers sell hundreds of thousands of old books from green boxes on the stone wall.",
"Boyayı tazele":"Refresh the paint","Kirişleri onar":"Repair the beams","Kuleyi ışıklandır":"Light up the tower","Gül pencereyi onar":"Repair the rose window","Kuleyi yeniden dik":"Raise the spire again","Çanları as":"Hang the bells","Kabartmaları onar":"Restore the carvings","Meydanı döşe":"Pave the square","Bayrağı as":"Raise the flag","Avluyu temizle":"Clean the courtyard","Piramidi camla":"Glaze the pyramid","Havuzları doldur":"Fill the pools","Taşları beyazlat":"Whiten the stones","Kubbeleri onar":"Repair the domes","Bahçeleri ek":"Plant the gardens","Cepheyi boya":"Paint the facade","Değirmeni döndür":"Spin the windmill","Ampulleri tak":"Fit the bulbs","Korkulukları onar":"Repair the railings","Heykelleri yaldızla":"Gild the statues","Fenerleri yak":"Light the lamps","Kutuları onar":"Repair the boxes","Kitapları diz":"Line up the books","Rıhtımı süsle":"Decorate the quay"});

function hbSign(d){return '<button class="hsign" data-id="'+d.id+'" style="left:'+hbX(d.ax)+'%;top:'+(hbY(d.ay)+3)+'%"><span>'+tt('Kur','Build')+'</span><em><img src="assets/ui_coin.webp" alt="">'+d.p+'</em></button>';}
function hbPips(lv){return '<i class="hpips">'+[1,2,3].map(k=>'<u class="'+(k<=lv?'on':'')+'"></u>').join('')+'</i>';}
function hbCard(d,s){const o=s[d.id],nx=hbNext(s);let st;
  if(o)st=d.deco?'<span class="hcs ok">+%25</span>':'<span class="hcs ok">'+hbPips(o.lv)+'</span>';
  else if(nx&&nx.id===d.id)st='<span class="hcs'+(coins>=d.p?'':' no')+'"><img src="assets/ui_coin.webp" alt="">'+d.p+'</span>';
  else st='<span class="hcs lk"><img src="assets/ui_lock.webp" alt=""></span>';
  return '<button class="hcard'+(o?' has':'')+(!o&&!(nx&&nx.id===d.id)?' lock':'')+'" data-id="'+d.id+'"><img src="'+hbThumb(d,o?o.lv:1)+'" alt=""><b>'+tt(d.n[0],d.n[1])+'</b>'+st+'</button>';}
function hbHead(s){const n=HB.filter(d=>s[d.id]).length,tot=HB.reduce((a,d)=>a+hbStored(d,s),0),bags=HB.filter(d=>hbStored(d,s)>0).length;
  return '<div class="rprog"><span>'+tt('Dükkânlar','Shops')+'</span><i><u style="width:'+(n/HB.length*100)+'%"></u></i><em>'+n+'/'+HB.length+'</em></div><div class="hinc"><img src="assets/ui_coin.webp" alt=""><b>'+hbDay(s)+'</b><span>'+tt('/gün','/day')+'</span>'+(bags>=2?'<button class="hall" id="hAll">'+tt('Topla','Collect')+' '+tot+'</button>':'')+'</div>';}
function hbSceneHTML(s,W,H,home){const fleet=portFleet(),nx=hbNext(s);
  let sc='<div class="pscene" style="height:'+H+'px"><img class="pbg" src="assets/'+PORTS[CURPORT].bg+'.webp" alt=""><i class="pshim"></i>';
  if(PORTS[CURPORT].top){[...HB].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(d=>{const o=s[d.id];if(!o)return;if(d.u&&o.lv>=2){sc+=hbUpLayer(d,o.lv);if(o.lv>=3)sc+=hbSmoke(d);}else sc+=hbLayer(d);});}else{
  HB.forEach(d=>{if(s[d.id])sc+=hbLayer(d);});
  HB.forEach(d=>{const o=s[d.id];if(o&&d.u){for(let l=2;l<=o.lv;l++)sc+=hbUpLayer(d,l);if(o.lv>=3)sc+=hbSmoke(d);}});}
  {const dk=psTheme().decor,dd=psOwnsCos('decor_'+dk)?dk:['yeniyil','kis'].find(x=>psOwnsCos('decor_'+x));if(dd){const k=PORTS[CURPORT].kis;sc+='<img class="hbl hbu hbs" src="assets/hb_'+dd+'.webp" alt="" style="left:'+(k[0]/HB_W*100)+'%;top:'+(k[1]/HB_H*100)+'%;width:'+(k[2]/HB_W*100)+'%"><i class="hsnowp" style="left:'+k[3]+'%;top:'+k[4]+'%"></i>';}}
  if(CURPORT==='ist')sc+='<i class="hsteam" style="left:17.6%;top:40.6%"></i><i class="hsteam s2" style="left:18.6%;top:40.9%"></i>';
  if(CURPORT==='ist'&&s.sus)sc+=HB_LIGHTS();
  HB_BERTHS.forEach((b,k)=>{const id=fleet[k];if(id){const c=[0,1,3][k];sc+='<button class="pferry" data-k="'+k+'" style="left:'+(b.x*W)+'px;top:'+(b.y*H)+'px;width:'+(W*.22)+'px;animation-delay:-'+(k*.9)+'s"><img src="'+fimgSrc(c,id)+'" alt=""></button>';}});
  for(let k=0;k<3;k++)sc+='<i class="gull pgull" style="top:'+(8+k*9)+'%;animation-duration:'+(15+k*4)+'s;animation-delay:-'+(k*6)+'s"><b><svg viewBox="0 0 40 16"><path d="M2 10 Q11 1 20 9 Q29 1 38 10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></b></i>';
  HB.forEach(d=>{if(s[d.id]&&!d.deco)sc+=hbBag(d,s);});
  if(nx&&(!home||hbOpen()))sc+=hbSign(nx);
  sc+='</div>';return sc;}

  document.querySelectorAll('.pswb').forEach(b=>b.onclick=()=>{if(b.dataset.p===CURPORT)return;sfx.tap();window._portSel=b.dataset.p;renderPort();});
  hbBind();
  document.querySelectorAll('.pferry').forEach(b=>b.onclick=()=>{ac();hornNote(0,.5,.22,1);try{b.animate([{translate:'0 0'},{translate:'0 -10px'},{translate:'0 0'}],{duration:420,easing:'ease-out',composite:'add'});}catch(e){}});
  const psc=$('psc');psc.scrollTop=Math.max(0,H*.27);
  clearInterval(window._hbT);window._hbT=setInterval(()=>{if(menuTab!=='port'||!$('psc')){clearInterval(window._hbT);return;}hbRefresh();},4000);

}

function hbTip(msg){const sc=document.querySelector('.pv');if(!sc)return;sc.querySelectorAll('.htip').forEach(e=>e.remove());sc.insertAdjacentHTML('beforeend','<div class="htip"><p>'+msg+'</p></div>');const t=sc.querySelector('.htip');t.onclick=()=>t.remove();setTimeout(()=>{if(t.isConnected){t.classList.add('out');setTimeout(()=>t.remove(),300);}},5200);}

  document.querySelectorAll('.hbl').forEach(b=>{b.style.pointerEvents='none';});
  const all=$('hAll');if(all)all.onclick=()=>{ac();HB.forEach((d,k)=>setTimeout(()=>hbCollect(d.id,true),k*140));};
  const sc=document.querySelector('.pscene');if(sc)sc.onclick=e=>{if(e.target.closest('button'))return;const r=sc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,s=hbS();let best=null,bd=.0036;HB.forEach(d=>{if(!s[d.id]||d.deco)return;const dd=(d.ax-x)**2+((d.ay+.03-y)*r.height/r.width)**2;if(dd<bd){bd=dd;best=d;}});if(best)hbSheet(best.id);};

function hbShelf(){const s=hbS(),sh=$('hShelf');if(!sh)return;const x=sh.scrollLeft;sh.innerHTML=HB.map(d=>hbCard(d,s)).join('');sh.scrollLeft=x;sh.querySelectorAll('.hcard').forEach(b=>b.onclick=()=>hbCardTap(b.dataset.id));}
function hbScrollTo(d,cb){const psc=$('psc'),S=window._pS;if(!psc){cb&&cb();return;}const ty=Math.max(0,d.ay*S.h-psc.clientHeight*.45),need=Math.abs(psc.scrollTop-ty)>8;psc.scrollTo({top:ty,behavior:'smooth'});setTimeout(()=>cb&&cb(),need?380:0);}

function hbFly(from,n){const t=($('mcoinv')&&$('mcoinv').closest('.pill'))||$('coin');if(!t)return;const a=app.getBoundingClientRect(),fr=from.getBoundingClientRect(),tr=t.getBoundingClientRect();

    setTimeout(()=>{c.remove();tone(1300+i*40,.05,'square',.03);try{t.animate([{scale:'1.15'},{scale:'1'}],{duration:160});}catch(e){}},850+del);}}
function hbCollect(id,quiet){const d=HB.find(x=>x.id===id),s=hbS(),o=s[id];if(!d||!o)return 0;const n=hbStored(d,s);if(n<1){if(!quiet){sfx.tap();hbSheet(id);}return 0;}

function jingle(){if(!soundOn)return;const a=ac();if(!a)return;const t0=a.currentTime+.05;
  if(MUS){try{MUS.g.gain.cancelScheduledValues(t0);MUS.g.gain.setTargetAtTime(.08,t0,.1);MUS.g.gain.setTargetAtTime(MUSV,t0+(SBUF.win?2.6:4.2),.6);}catch(e){}}
  if(sp('win'))return;
  const out=a.createGain();out.gain.value=.9;const dl=a.createDelay();dl.delayTime.value=.19;const fb=a.createGain();fb.gain.value=.28;const wet=a.createGain();wet.gain.value=.35;
  out.connect(a.destination);out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(a.destination);
  const F=n=>440*Math.pow(2,(n-69)/12);
  const nt=(m,st,du,ty,v,at)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=F(m);const s1=t0+st;g.gain.setValueAtTime(.0001,s1);g.gain.linearRampToValueAtTime(v,s1+(at||.015));g.gain.exponentialRampToValueAtTime(.0001,s1+du);o.connect(g);g.connect(out);o.start(s1);o.stop(s1+du+.05);
    if(ty!=='sine'){const o2=a.createOscillator();o2.type=ty;o2.frequency.value=F(m)*1.004;o2.connect(g);o2.start(s1);o2.stop(s1+du+.05);}};
  const b=.135;
  // melodi: yükselen arpej + zafer motifi
  [[67,0],[72,1],[76,2],[79,3],[76,4.5],[79,5],[84,6]].forEach(([m,k])=>nt(m,k*b,k===6?1.6:.28,'square',.05));
  [[67,0],[72,1],[76,2],[79,3],[76,4.5],[79,5],[84,6]].forEach(([m,k])=>nt(m+12,k*b,k===6?1.4:.22,'sine',.035));
  // ikinci cümle
  [[81,8],[79,8.5],[81,9],[83,9.5],[84,10]].forEach(([m,k])=>nt(m,k*b,k===10?1.8:.22,'triangle',.08));
  // bas
  [[48,0,.5],[43,3,.4],[48,6,.6],[53,8,.5],[48,10,1.8]].forEach(([m,k,d])=>nt(m,k*b,d,'triangle',.13));
  // final akor
  [60,64,67,72,76].forEach((m,q)=>nt(m,10*b+q*.02,2,'sawtooth',.018,.06));

  // vapur selamı

  setTimeout(()=>{try{out.disconnect();wet.disconnect();}catch(e){}},6000);}

/* ---------- v1.44 Sonsuz Sefer (yayındaki bölümler bitince döngü) + Günün Zor Bölümü + internet şartı ----------
   Sanal bölüm numaraları: LOOP0+n = Sonsuz Sefer'in n. bölümü, DAY0+gün = günün bölümü. Oyuncunun 'level' kaydı MAXL+1'de kalır;
   güncellemeyle yeni şehir gelince (MAXL artınca) kaldığı yerden yeni şehre geçer. Sanal bölümler, doğrulanmış 21-120 paket
   bölümlerinden renk değiştirilerek üretilir (çözülebilirlik korunur). */
function loopOn(){try{return cfg('loop_on')!==false;}catch(e){return true;}}
function loopN(){return store.get('loopN',0)|0;}
function loopL(){return LOOP0+loopN()+1;}
function dayIdx(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function dayL(){return DAY0+dayIdx();}
function dayPool(){const top=Math.min(MAXL,Math.max(21,curLevel()-1)),a=[];for(let L=21;L<=top;L++)if(tierOf(L)>=1)a.push(L);return a.length?a:[20];}
function dayBase(d){let o=store.get('dlv',null);if(!o||o.d!==d){const P=dayPool(),r=rngOf(d*7919+13);o={d,b:P[Math.floor(r()*P.length)]};store.set('dlv',o);}return o.b;}
function lvBase(L){if(L>DAY0)return dayBase(L-DAY0);if(L>LOOP0){const n=L-LOOP0-1;return 21+((n*37)%100);}return L;}
function virtLevel(L){const b=lvBase(L),lv=JSON.parse(JSON.stringify(generateLevel(b))),r=rngOf(L*2654435+7),pm=[0,1,2,3,4,5];
  for(let i=pm.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pm[i],pm[j]]=[pm[j],pm[i]];}
  const P=c=>(c>=0&&c<6)?pm[c]:c;
  lv.cells=lv.cells.map(P);lv.ferries=lv.ferries.map(P);
  if(lv.gond)lv.gond.forEach(g=>{g.q=g.q.map(P);});
  if(lv.tul)for(const k in lv.tul)lv.tul[k]=lv.tul[k].map(P);
  if(lv.locks){const o={};for(const k in lv.locks)o[+k]=lv.locks[k];lv.locks=o;}
  if(lv.fam){const o={};for(const k in lv.fam)o[+k]=lv.fam[k];lv.fam=o;}
  if(lv.cafe){const o={};for(const k in lv.cafe)o[+k]=lv.cafe[k];lv.cafe=o;}
  if(lv.tul){const o={};for(const k in lv.tul)o[+k]=lv.tul[k];lv.tul=o;}
  lv.L=L;return lv;}
function lvName(L){if(L>MAXL&&L<=LOOP0&&loopOn())L=loopL();if(L>DAY0)return '📅 '+tt('Günün Bölümü','Daily Level');if(L>LOOP0)return '∞ '+tt('Sefer ','Voyage ')+(L-LOOP0);return _t('Bölüm ')+L;}

const DAY_RW=[100,120,140,160,180,200,250];
function dayOn(){try{return cfg('day_on')!==false&&curLevel()>=cfg('day_from');}catch(e){return false;}}
function dayDoneToday(){return store.get('dayDone',-1)===dayIdx();}
function dayStreak(){const s=store.get('daySt',{n:0,d:-9});return (s.d===dayIdx()||s.d===dayIdx()-1)?s.n:0;}
function dayDone(){const d=dayIdx();if(store.get('dayDone',-1)===d)return;store.set('dayDone',d);
  const s=store.get('daySt',{n:0,d:-9}),n=s.d===d-1?s.n+1:1;store.set('daySt',{n,d});
  const rw=DAY_RW[Math.min(n,DAY_RW.length)-1];track('daily_win',{streak:n});
  setTimeout(()=>{setCoins(coins+rw,true);try{sfx.coin();}catch(e){}toast('📅 '+tt('Günün bölümü tamam! +'+rw+' 🪙 · Seri '+n,'Daily level done! +'+rw+' 🪙 · Streak '+n),true);},1900);}
function dayLeft(){const d=new Date(),n=new Date(d);n.setHours(24,0,0,0);return n-d;}

function iapInit(){const S=iapStore();if(!S||_iapInited)return;_iapInited=true;track('iap_init',{});const {store:st,ProductType:PT,Platform:PF}=S;
  st.register(Object.entries(SKU).map(([k,id])=>({id,type:k==='club'?PT.PAID_SUBSCRIPTION:k==='noads'?PT.NON_CONSUMABLE:PT.CONSUMABLE,platform:iapPF(S)})));
  st.when().approved(t=>t.verify()).verified(r=>r.finish()).finished(t=>{const ids=(t.products||[]).map(x=>x.id),P=_iapPend;
      if(P&&ids.includes(SKU[P.k])){_iapPend=null;track('purchase',{item:P.k});try{P.fn();}catch(e){errLog(e);}saveEco&&saveEco();}
      else if(ids.includes(SKU.noads)){store.set('noads',true);}else if(ids.includes(SKU.club)){store.set('clubOwned',true);}})
    .productUpdated(pr=>{if(pr.id===SKU.noads&&pr.owned&&!store.get('noads',false)){store.set('noads',true);try{renderMenu();}catch(e){}}
      if(pr.id===SKU.club){const was=!!store.get('clubOwned',false);if(pr.owned)store.set('clubOwned',true);else if(_iapReady)store.set('clubOwned',false);if(was!==!!store.get('clubOwned',false)){track('club_state',{on:store.get('clubOwned',false)?1:0});try{renderMenu();}catch(e){}}}});
  st.ready(()=>{_iapReady=true;try{const pc=st.get(SKU.club,iapPF(S));if(pc)store.set('clubOwned',!!pc.owned);clubDaily();}catch(e){}});
  st.error(e=>errLog(e&&e.message||e));
  st.initialize([iapPF(S)]).catch(e=>errLog(e));}

       :tt('Haftalık abonelik: iptal edene kadar her hafta '+P+' Google Play hesabından otomatik olarak yenilenir. İstediğin zaman Google Play › Ödemeler ve abonelikler bölümünden iptal edebilirsin; iptal edersen haftanın sonuna kadar avantajların sürer. İsteğe bağlı ödüllü reklamlar açık kalır.',

  const x=()=>{hideModal();if(back)back();};$('clX').onclick=()=>{sfx.tap();x();};

// Android geri tuşu: açık pencereyi kapat → menüye dön → uygulamayı küçült
function backBtn(){try{
  const st=$('studio');if(st){st.dispatchEvent(new Event('pointerdown'));return;}

  if(T&&!mOn)return;

/* v1.46 Canlı güncelleme (Apple/Google onayı beklemeden): oyunun kodu ve görselleri tealbirdgames.com/ota/ferrytales'den
   güncellenir. Uygulama açılınca manifest kontrol edilir, sadece değişen dosyalar indirilir, oyuncu uygulamadan çıkıp dönünce yeni sürüm açılır.
   Yeni yerel eklenti gerektiren değişiklikler için manifestte native_min_ios / native_min_android (derleme numarası) yükseltilir. */
const WEB_VER='1.54.1';
const OTA_BASE='https://tealbirdgames.com/ota/ferrytales/';
function verGT(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)>(y[i]||0))return true;if((x[i]||0)<(y[i]||0))return false;}return false;}
async function otaCheck(){const U=plug('CapacitorUpdater');if(!U)return;
  try{await U.notifyAppReady();}catch(e){}
  try{if(cfg('ota_on')===false)return;
    const r=await fetch(OTA_BASE+'manifest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=await r.json();
    if(!m||!m.version||!Array.isArray(m.files)||!verGT(m.version,WEB_VER))return;
    try{const A=plug('App'),inf=A&&A.getInfo?await A.getInfo():null,bn=parseInt(inf&&inf.build)||0,need=IOS()?m.native_min_ios:m.native_min_android;if(need&&bn<need){track('ota_skip',{v:m.version,bn});return;}}catch(e){}
    const L=await U.list().catch(()=>({bundles:[]}));let b=(L.bundles||[]).find(x=>x.version===m.version&&x.status==='success');
    if(!b){track('ota_dl',{v:m.version});b=await U.download({url:OTA_BASE+'manifest.json',version:m.version,manifest:m.files});}
    await U.next({id:b.id});track('ota_ready',{v:m.version});}catch(e){errLog(e);track('ota_fail',{});}}
function nativeBoot(){if(!NATIVE())return;document.documentElement.classList.add('nat');
  try{const U=plug('CapacitorUpdater');U&&U.notifyAppReady&&U.notifyAppReady().catch(()=>{});}catch(e){}
  setTimeout(()=>{otaCheck();},6000);
  try{const SB=plug('StatusBar');if(SB){SB.setOverlaysWebView&&SB.setOverlaysWebView({overlay:true}).catch(()=>{});SB.hide&&SB.hide().catch(()=>{});}}catch(e){}
  try{const A=plug('App');if(A&&A.addListener)A.addListener('backButton',backBtn);}catch(e){}
  try{rcfgInit();}catch(e){}
  if(document.readyState==='complete')setTimeout(()=>{adInit();},4000);else window.addEventListener('load',()=>setTimeout(adInit,4000));
  iapBoot();}
function notifPlan(){
  const out=[],now=Date.now();
  try{tickLives();const M=maxLife();if(lives<M&&lifeTs){const at=lifeTs+(M-lives)*lifeMs();if(at-now>5*60e3)out.push({id:11,at,t:tt('Canların doldu! ❤️','Lives are full! ❤️'),b:tt('Vapurlar seni bekliyor, '+pierName(curLevel())+' İskelesi\'ne dön.','Ferries are waiting, head back to the pier.')});}}catch(e){}
  try{const S=hbS();let best=0;HB.forEach(d=>{const o=S[d.id];if(o&&!d.deco){const at=o.t+hbCap();if(at>now&&(!best||at<best))best=at;}});if(best)out.push({id:12,at:best,t:tt('Limanın doldu 🪙','Your harbor is full 🪙'),b:tt('İşletmelerin altın biriktirdi, toplamayı unutma!','Your shops have collected coins, come grab them!')});}catch(e){}
  {const d=new Date();d.setDate(d.getDate()+1);d.setHours(19,0,0,0);out.push({id:13,at:+d,t:tt('Günlük hediyen hazır 🎁','Your daily gift is ready 🎁'),b:wst()>1?tt('🔥 '+wst()+'\'li serin seni bekliyor!','🔥 Your '+wst()+'-win streak is waiting!'):tt('Seriyi bozma, hediye her gün büyüyor.','Keep the streak, the gift grows every day.')});}
  {const d=new Date(now+3*864e5);d.setHours(19,30,0,0);out.push({id:14,at:+d,t:tt('Boğaz seni özledi ⛴️','The Bosphorus misses you ⛴️'),b:tt('Yolcular iskelede birikti, yeni bölümler seni bekliyor.','Passengers are piling up at the pier.')});}
  try{if(unl('race')&&cfg('race_on')){const w=rcWin();const at=w.s>now?w.s:w.s+7*864e5;out.push({id:16,at,t:tt('Boğaz Yarışı başladı! 🏁','The Bosphorus Race has started! 🏁'),b:tt('4 kaptan seni bekliyor. 10 bölümü ilk geçen kazanır.','4 captains are waiting. First to clear 10 levels wins.')});}}catch(e){}
  try{if(unl('week')){const at=wkEnd()+12*3600e3;out.push({id:15,at,t:tt('Yeni haftalık görevler 🏆','New weekly tasks 🏆'),b:tt('3 yeni görev ve büyük sandık seni bekliyor.','3 new tasks and a grand chest are waiting.')});}}catch(e){}
  return out.filter(n=>n.at>now+60e3);
}
async function notifSchedule(ask){const LN=plug('LocalNotifications');if(!LN||store.get('notifOff',false))return;
  try{const pr=await LN.checkPermissions();if(pr.display!=='granted'){if(!ask||store.get('notifAsked',false))return;store.set('notifAsked',true);const r=await LN.requestPermissions();if(r.display!=='granted')return;}
    await LN.cancel({notifications:[11,12,13,14,15,16].map(id=>({id}))});
    const plan=notifPlan();if(plan.length)await LN.schedule({notifications:plan.map(n=>({id:n.id,title:n.t,body:n.b,schedule:{at:new Date(n.at),allowWhileIdle:true}}))});
    track('notif_sched',{n:plan.length});}catch(e){errLog(e);}}
// tüm ilerleme tek paket: bulut kayıt ve cihaz değişimi için
function saveBlob(){const o={v:1,t:Date.now()};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('vy_')&&!/^vy_(anq|errlog)$/.test(k))o[k]=localStorage.getItem(k);}return JSON.stringify(o);}
function loadBlob(js){const o=JSON.parse(js);if(!o||o.v!==1)throw new Error('bad save');Object.keys(o).forEach(k=>{if(k.startsWith('vy_'))localStorage.setItem(k,o[k]);});}
function progScore(o){const g=k=>{try{return JSON.parse(o['vy_'+k]||'0')||0;}catch(e){return 0;}};return g('level')*1000+g('stars');}
/* v1.54 bulut kayıt: Android = Google Play Games Saved Games, iOS = iCloud key-value (yerel eklenti adı CloudSave).
   - Yeni kurulumda (yerelde gerçek ilerleme yoksa) buluttaki daha ileri kayıt sormadan geri yüklenir.
   - Yerelde de ilerleme varsa oyuncuya sorulur. Buluttaki daha ileri kayıt, oyuncu "yeni başla" demedikçe ezilmez. */
function cloudP(){return plug('CloudSave')||plug('PlayGamesSave');}
function blobNoT(js){try{const o=JSON.parse(js);delete o.t;return JSON.stringify(o);}catch(e){return js;}}
let _cloudLast='',_cloudBusy=false,_cloudChecked=false;
async function cloudSave(force){const P=cloudP();if(!P||_cloudBusy||!_cloudChecked)return;
  try{const js=saveBlob(),k=blobNoT(js);if(!force&&k===_cloudLast)return;_cloudBusy=true;
    await P.save({name:'vapura',data:js,description:tt('Bölüm ','Level ')+curLevel()});_cloudLast=k;store.set('cloudT',Date.now());}
  catch(e){errLog(e);}finally{_cloudBusy=false;}}
async function cloudSync(){const P=cloudP();if(!P)return;
  try{if(!_cloudChecked){const inter=!store.get('cloudSignAsk',0);store.set('cloudSignAsk',1);
      const r=await P.load({name:'vapura',interactive:inter}).catch(e=>{errLog(e);return null;});
      if(!r||r.signedIn===false){track('cloud_nosign',{i:inter?1:0});return;}
      _cloudChecked=true;
      if(r&&r.data){let remote=null;try{remote=JSON.parse(r.data);}catch(e){}
        if(remote&&remote.v===1){const local=JSON.parse(saveBlob()),rs=progScore(remote),ls=progScore(local),decl=store.get('cloudDecl',-1);
          if(rs>ls&&decl!==rs){
            if(ls<5000){loadBlob(r.data);store.set('cloudRestored',1);track('cloud_load',{auto:1,L:JSON.parse(remote.vy_level||'1')});location.reload();return;}
            showModal('<div class="em">☁️</div><h2>'+tt('Kayıtlı ilerleme bulundu','Saved progress found')+'</h2><p>'+tt('Bulutta daha ileri bir kayıt var (Bölüm ','A further save exists in the cloud (Level ')+JSON.parse(remote.vy_level||'1')+'). '+tt('Yüklensin mi?','Load it?')+'</p><button class="btn gold" id="clY">'+tt('Evet, yükle','Yes, load')+'</button><button class="btn alt" id="clN">'+tt('Hayır, buradakiyle devam et','No, keep this one')+'</button>');
            $('clY').onclick=()=>{loadBlob(r.data);store.set('cloudRestored',1);track('cloud_load',{auto:0});location.reload();};
            $('clN').onclick=()=>{store.set('cloudDecl',rs);track('cloud_decline',{});hideModal();cloudSave(true);};return;}}}}
    await cloudSave(false);}catch(e){errLog(e);}}
function cloudRestoredNote(){try{if(store.get('cloudRestored',0)){store.set('cloudRestored',0);setTimeout(()=>toast(tt('☁️ İlerlemen buluttan geri yüklendi','☁️ Your progress was restored from the cloud'),true),1500);}}catch(e){}}
setInterval(()=>{try{if(NATIVE()&&document.visibilityState==='visible')cloudSave(false);}catch(e){}},180000);
function appPause(){try{track('session_end',{L:curLevel()});notifSchedule();if(_cloudChecked)cloudSave(true);else cloudSync();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')appPause();});
setTimeout(()=>{try{if(NATIVE()){const A=plug('App');if(A&&A.addListener)A.addListener('pause',appPause);cloudSync();cloudRestoredNote();}}catch(e){}},1200);
try{nativeBoot();}catch(e){}
try{snowFx();}catch(e){}
