<!DOCTYPE html>
<html lang="tr" class="tbon">
<head>
<style>html.tbon,html.tbon body{background:#eef9f8!important}.shclub{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:10px 12px;border:0;border-radius:16px;font-family:inherit;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(135deg,#0d3b66,#1a5f9e 60%,#0d3b66);box-shadow:inset 0 0 0 3px #f2c14e,0 4px 0 #082640}

</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a4a78">
<title>Vapura Yetiş</title>
<style>
:root{--ink:#10263a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a3f66;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;height:100vh;height:100dvh;height:calc(100dvh - var(--banh,0px));max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#0a3f66}
header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--sat,env(safe-area-inset-top)) + 10px) 12px 8px;background:#0a3f66;z-index:3}
.ttl{flex:1;min-width:0}
.ttl b{display:block;white-space:nowrap;font-size:clamp(15px,4.6vw,19px);font-weight:800;letter-spacing:.2px}
.ttl span{display:block;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer}
.ib:active{transform:scale(.94)}

#sea{--s1:#69bde9;--s2:#a6dcf5;--w1:#1d8cce;--w2:#0f6aa6;--sk:#2f6f99;position:relative;flex:none;height:clamp(116px,19vh,150px);overflow:hidden;background:linear-gradient(var(--s1) 0%,var(--s2) 44%,var(--w1) 44%,var(--w2) 100%);transition:background .6s}
#skyline{fill:var(--sk)}
#skyline{position:absolute;left:0;right:0;top:22px;height:44px;width:100%;opacity:.55}
.wave{position:absolute;left:-20%;right:-20%;height:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 34px);border-radius:4px;animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(34px)}}
#ferry{position:absolute;bottom:12px;left:42%;width:190px;height:96px;transform:translateX(-50%);will-change:transform}
#ferry .fsvg{position:absolute;inset:0;width:190px;height:96px}
#ferry .seat{position:absolute;top:24px;width:24px;height:14px;border-radius:3px;overflow:hidden}
#ferry .seat.on{background:linear-gradient(transparent 55%,var(--c) 55%);animation:pop .3s ease}
#ferry .seat.on::before{content:"";position:absolute;left:7px;top:1px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe2c6,#e9b58a)}
#ferry .seat.on::after{content:"";position:absolute;left:4px;bottom:0;width:16px;height:6px;border-radius:5px 5px 0 0;background:var(--c);box-shadow:inset 0 -2px 0 var(--d)}
#queue{position:absolute;right:8px;top:38%;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#queue .row{display:flex;gap:5px}
.mini{width:28px;height:14px;border-radius:3px 3px 10px 6px;background:linear-gradient(#fff,#dfe7ee);border-bottom:5px solid var(--c);box-shadow:0 3px 0 #1d2b3a;position:relative}.mini::after{content:'';position:absolute;right:5px;top:-6px;width:5px;height:7px;background:var(--c);border-top:2px solid #111}
#count{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px}

#benchwrap{flex:none;background:linear-gradient(#7a4f28,#6a431f);padding:5px 10px 8px;box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:1}
#benchwrap small{display:block;font-size:10px!important;text-align:center;font-size:11px;font-weight:700;opacity:.8;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
#bench{display:flex;justify-content:center;gap:6px}
.slot{flex:0 1 54px;aspect-ratio:1;min-width:0;border-radius:14px;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.12),rgba(0,0,0,.32));border:2px dashed rgba(255,255,255,.28);box-shadow:inset 0 3px 5px rgba(0,0,0,.3)}
#benchwrap.full .slot{border-color:#ff6b6b}

#pier{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;background:repeating-linear-gradient(0deg,#c99a63 0 22px,#bd8c55 22px 23px);padding:6px 10px calc(var(--sab,env(safe-area-inset-bottom)) + 10px)}
#gate{flex:none;font-size:11px;font-weight:800;color:#5a3a19;opacity:.75;letter-spacing:.5px;margin-bottom:4px}
#gridbox{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center}
#grid{position:relative;border-radius:14px;background:#a8763f;box-shadow:inset 0 3px 6px rgba(0,0,0,.25),0 3px 0 rgba(255,255,255,.25)}
.tile{position:absolute;border-radius:10px;background:linear-gradient(#ddb37e,#cfa069);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(90,55,20,.25)}
#hint:empty{display:none}
#hint{flex:none;font-size:12.5px;color:#4a2f12;font-weight:600;text-align:center;padding:4px 8px 0;min-height:18px}

#stage{position:absolute;inset:0;pointer-events:none;z-index:5}
.fig{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer}
.fig::before{content:'';position:absolute;left:12%;right:12%;bottom:-4%;height:16%;border-radius:50%;background:rgba(60,30,0,.3)}
.fig .hd{position:absolute;left:29%;top:3%;width:42%;height:42%;border-radius:50%;background-color:#f3c9a1;background-image:radial-gradient(circle at 34% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 45%);box-shadow:inset -2px -3px 0 rgba(0,0,0,.13)}
.fig .ey{position:absolute;left:38%;top:24%;width:24%;height:8%}
.fig .ey::before,.fig .ey::after{content:'';position:absolute;top:0;width:28%;height:100%;border-radius:50%;background:#1b1b1b;box-shadow:inset 1px 1px 0 rgba(255,255,255,.5)}.fig .ey::before{left:0}.fig .ey::after{right:0}
.fig .gl~.ey,.fig.hid .ey{opacity:.0}
.fig .hd::before{content:"";position:absolute;left:4%;right:4%;top:-4%;height:40%;border-radius:50% 50% 25% 25%;background:var(--hair,#3b2a1f)}
.fig .bd{position:absolute;left:15%;top:38%;width:70%;height:58%;border-radius:46% 46% 24% 24%;background:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,0) 40%,rgba(0,0,0,.16)),var(--c);box-shadow:inset 0 -5px 0 var(--d),inset 3px 0 0 rgba(255,255,255,.15)}
.fig .bd::before{content:'';position:absolute;left:36%;width:28%;top:0;height:16%;border-radius:0 0 50% 50%;background:rgba(255,255,255,.55)}
.fig .q{display:none}
.fig.hid .bd{background:linear-gradient(140deg,rgba(255,255,255,.3),rgba(255,255,255,0) 40%),#6b7785;box-shadow:inset 0 -5px 0 #4a5562}.fig.hid .bd::before{display:none}
.fig.hid .hd{background:#8a96a3!important}.fig.hid .hd::before{background:#5d6873}
.fig.hid .q{display:block;position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;color:#fff;font-size:calc(var(--s,44px)*.36);line-height:1.3}
.fig.spr::before{left:16%;right:16%;bottom:-2%;height:14%}
.fig .pi{position:absolute;left:50%;bottom:-2%;height:122%;width:auto;transform:translateX(-50%);pointer-events:none;-webkit-user-drag:none;user-select:none}
.fig.spr.hid .q{display:none}
.fig.spr.ok .pi{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.fig.rev{animation:rev .35s ease}
@keyframes rev{50%{transform:scale(1.25)}}
.fig.ok .bd{outline:2.5px solid rgba(255,255,255,.95);outline-offset:-1px}
.fig.ok{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{50%{translate:0 -1.5px}}
.fig.blk{filter:brightness(.88) saturate(.8);opacity:.72}
.fig.mv{transition:left .19s cubic-bezier(.3,.7,.4,1),top .19s cubic-bezier(.3,.7,.4,1),transform .19s ease}

#toast{position:absolute;left:50%;top:calc(var(--sat,env(safe-area-inset-top)) + 66px);transform:translate(-50%,-10px);background:#d7263d;color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:12px;opacity:0;transition:.2s;z-index:8;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* v1.52.3: satın alma butonlarına basış hissi */
#tab-shop .shc,#tab-shop .shoffer,#tab-shop #shClub,#tab-shop #shStart,#tab-shop #shKmb,.modal .btn.gold{transition:transform .08s ease,filter .08s ease}
#tab-shop .shc:active,#tab-shop .shoffer:active,#tab-shop #shClub:active,#tab-shop #shStart:active,#tab-shop #shKmb:active{transform:scale(.95);filter:brightness(.9)}
.modal .btn.gold:active{transform:scale(.95) translateY(2px);filter:brightness(.92)}
#toast{z-index:9999!important;max-width:calc(100% - 28px);white-space:normal!important;text-align:center;width:max-content}/* v1.52.2: uyarılar menü/dükkân ekranının üstünde görünsün */
#toast.good{background:#1f9d57}

#modal{position:absolute;inset:0;background:rgba(5,25,45,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
#modal.show{display:flex}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:24px 20px 20px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card .em{font-size:48px;line-height:1}
.card h2{margin:10px 0 6px;font-size:22px}
.card p{margin:0 0 18px;font-size:15px;color:#3d5366;line-height:1.4}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;color:#fff;background:#1d8cce;cursor:pointer;box-shadow:0 4px 0 #0f5f8f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0f5f8f}
.btn.alt{background:#eef3f7;color:#3d5366;box-shadow:0 4px 0 #cbd6df;margin-top:10px}

.coin{height:40px;border:0;border-radius:20px;background:#ffd84d;color:#5a3a00;font-weight:900;font-size:15px;padding:0 6px 0 10px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #c99a00;cursor:pointer}
.coin em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#2fb36b;color:#fff;display:grid;place-items:center;font-size:16px;margin-left:2px}
.coin.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.15)}}
#boosters{flex:none;display:flex;gap:12px;justify-content:center;padding-top:8px}
.bst{position:relative;width:92px;height:clamp(48px,7vh,60px);border:0;border-radius:16px;background:#fff8ec;color:#5a3a19;box-shadow:0 4px 0 #9c6b38;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
.bst .ic{font-size:clamp(17px,2.8vh,22px);line-height:1}
.bst:active{transform:translateY(2px);box-shadow:0 2px 0 #9c6b38}
.bst.off{opacity:.45}
.badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:#e5484d;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.badge.price{background:#ffd84d;color:#5a3a00;font-size:11px}
.slot.newslot{animation:pop .4s cubic-bezier(.3,1.4,.5,1);border-color:#ffd84d}
.reward{font-size:28px;font-weight:900;color:#c99a00;margin:-6px 0 14px}
.btn.gold{background:#2fb36b;box-shadow:0 4px 0 #1e7f4a;margin-bottom:10px}
.btn.gold:active{box-shadow:0 2px 0 #1e7f4a}
.btn + .btn{margin-top:10px}.btn.gold + .btn{margin-top:0}
.adc{font-size:42px;font-weight:900;color:#1d8cce}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pack{border:2px solid #e3eaf0;background:#f7fafc;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:#10263a;cursor:pointer}
.pack span{font-size:11.5px;font-weight:700;color:#3d5366}
.pack b{font-size:18px}
.pack i{font-style:normal;font-size:13px;font-weight:800;background:#2fb36b;color:#fff;border-radius:8px;padding:2px 8px}
.pack.best{border-color:#ffd84d;background:#fffbea}
.card .warn{color:#c0392b;font-weight:700;margin-bottom:12px}
.card .note{font-size:11.5px;color:#7a8b99;margin:0 0 6px}

.starp{height:40px;border:0;border-radius:20px;background:#fff;color:#7a4a00;font-weight:900;font-size:15px;padding:0 4px 0 10px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #b9c6d1;cursor:pointer;font-family:inherit}
.starp em{font-style:normal;font-size:16px;margin-left:1px}
.starp.bump{animation:bump .4s ease}
.gull{position:absolute;left:-30px;width:22px;height:10px;fill:none;stroke:var(--gull,#fff);stroke-width:2;stroke-linecap:round;animation:gfly linear infinite;opacity:.9}
@keyframes gfly{0%{left:-30px;translate:0 0}25%{translate:0 -6px}50%{translate:0 3px}75%{translate:0 -4px}100%{left:110%;translate:0 0}}
#sun{position:absolute;right:22%;top:8%;width:30px;height:30px;border-radius:50%;background:#fff6c9;box-shadow:0 0 18px 6px rgba(255,240,170,.7);transition:.6s}
#nstars{position:absolute;inset:0 0 56% 0;opacity:0;transition:.6s;background-image:radial-gradient(1.5px 1.5px at 10% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 25% 60%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 45%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 50%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 93% 25%,#fff 50%,transparent 51%)}
#sea.night #nstars{opacity:1}
#sea.night #sun{background:#f4f1e3;box-shadow:0 0 14px 4px rgba(255,255,255,.35);width:22px;height:22px}
#sea.sunset #sun{background:#ffb347;box-shadow:0 0 30px 12px rgba(255,140,60,.6);top:26%;width:40px;height:40px}
#sea.noon #sun{right:60%;top:5%}
#sea.night .wave{opacity:.35}
#sea.night #skyline{opacity:.9}
.smoke{position:absolute;left:146px;bottom:86px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75);animation:smk 2.4s ease-out infinite;pointer-events:none}
.smoke.s2{animation-delay:-.8s}.smoke.s3{animation-delay:-1.6s}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:.8}100%{transform:translate(-26px,-34px) scale(2.2);opacity:0}}
#ferry.bob{animation:fbob 2.6s ease-in-out infinite}
@keyframes fbob{50%{margin-bottom:-3px}}
.fig .cap{position:absolute;left:25%;top:0;width:50%;height:18%;border-radius:40% 40% 10% 10%;background:var(--cap);box-shadow:4px 3px 0 -1px var(--cap)}
.fig .gl{position:absolute;left:31%;top:20%;width:38%;height:9%;border-radius:3px;background:#1d1d1d;opacity:.85}
.fig .bag{position:absolute;right:6%;top:52%;width:20%;height:30%;border-radius:4px;background:var(--bagc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.fig.hid .cap,.fig.hid .gl,.fig.hid .bag{display:none}
#banner{position:absolute;left:0;right:0;top:46%;z-index:7;text-align:center;pointer-events:none;opacity:0;transform:translateX(40px)}
#banner.go{animation:bnr 1.5s ease forwards}
@keyframes bnr{0%{opacity:0;transform:translateX(60px)}18%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-60px)}}
#banner b{display:inline-block;font-size:30px;font-weight:900;color:#fff;background:#1d8cce;padding:6px 22px;border-radius:16px;box-shadow:0 5px 0 #0f5f8f}
#banner span{display:inline-block;margin-top:10px;font-weight:800;color:#4a2f12;font-size:14px;background:#fff8ec;padding:4px 12px;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.15)}#banner b{display:table!important;margin:0 auto}
#banner.hard b{background:#e5484d;box-shadow:0 5px 0 #a8232b}
#banner.mid b{background:#f08a1c;box-shadow:0 5px 0 #b05f00}
.stars3{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.stars3 i{font-style:normal;font-size:40px;filter:grayscale(1) opacity(.3);transform:scale(.4);transition:.35s cubic-bezier(.3,1.6,.5,1)}
.stars3 i.on{filter:none;transform:scale(1)}
.stars3 i:nth-child(2){font-size:48px;margin-top:-8px}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:9;pointer-events:none}

#menu{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;background:linear-gradient(#5db7ea 0%,#a7dcf6 42%,#1d8cce 42%,#0d4f82 100%)}
#menu.show{display:flex;animation:fadein .25s ease}
.adbst{display:grid;place-items:center;margin:4px auto 6px}.adbst img{width:96px;height:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.shb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.shb3 .sb1{padding:8px 4px 10px!important;min-height:0!important}.shb3 .sb1 b{font-size:12px}.sb1i{position:relative;display:block;height:46px}.sb1i img{height:44px;width:auto}.sb1i em{position:absolute;right:6px;bottom:-2px;font-style:normal;font-family:'Lilita One','Fredoka',sans-serif;color:#fff;font-size:15px;text-shadow:0 2px 0 #7a4a12,0 0 3px #7a4a12}
#app .bst.lockb{display:none!important}
.lnk{display:block;margin:6px auto 0;background:none;border:0;color:#5b6b80;font:inherit;font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 10px}.btn.done{opacity:.6;pointer-events:none}
@keyframes fadein{from{opacity:0}}
.mbg{position:absolute;left:0;right:0;top:calc(42% - 40px);height:42px;opacity:.5;fill:#2f6f99;pointer-events:none}
.mbg svg{width:100%;height:100%}
.mtop{position:relative;display:flex;align-items:center;gap:8px;padding:calc(var(--sat,env(safe-area-inset-top)) + 10px) 12px 6px}
.mtop .ib{background:rgba(0,40,80,.35)}
.mpills{margin-left:auto;display:flex;gap:8px}
.pill{height:36px;border:0;border-radius:18px;background:#fff;color:#7a4a00;font-weight:900;font-size:15px;padding:0 12px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-family:inherit}
.pill.gold{background:#ffd84d;color:#5a3a00;padding-right:5px}.pill em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#2fb36b;color:#fff;display:grid;place-items:center}
.mbody{position:relative;flex:1;min-height:0}
.tab{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 14px;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.tab.on{display:flex;animation:fadein .2s ease}
.mtabs{position:relative;display:flex;background:#0b3a60;padding:6px 8px calc(var(--sab,env(safe-area-inset-bottom)) + 6px);gap:6px;box-shadow:0 -3px 0 rgba(0,0,0,.2)}
.mtabs button{flex:1;border:0;border-radius:14px;background:transparent;color:#a9c6dd;font-family:inherit;font-weight:800;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}

.bst{background:linear-gradient(#fffaf0,#f3e3c8);box-shadow:0 5px 0 #9c6b38,inset 0 2px 0 #fff}
header{background:linear-gradient(#0d4c7a,#0a3f66);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#benchwrap{box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.12)}
/* yol düğümleri 2.5D */
.nd{width:62px;height:62px;border:4px solid #fff;box-shadow:0 7px 0 #5f6d79,0 12px 16px rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(0,0,0,.12)}

.nd.cur{width:76px;height:76px;margin:-7px 0 0 -7px;box-shadow:0 8px 0 #b98600,0 0 0 7px rgba(255,216,77,.45),0 14px 18px rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.7),inset 0 -6px 0 rgba(0,0,0,.1)}
.nd.t1:not(.done):not(.cur){box-shadow:0 7px 0 #a35d0e,0 12px 16px rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.12)}
.nd.t2:not(.done):not(.cur){box-shadow:0 7px 0 #8f1c22,0 12px 16px rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.5),inset 0 -6px 0 rgba(0,0,0,.12)}
.rscroll{background:linear-gradient(#1f8fd6,#1677b8 50%,#0f5f99);background-image:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.08)),radial-gradient(circle at 20% 10%,#3aa6e2,transparent 50%),linear-gradient(#1f8fd6,#0f5f99)}
.ndboat{bottom:58px}
.ndwave{position:absolute;left:24px;right:24px;bottom:4px;height:14px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 6px rgba(255,255,255,.18)}
/* bölüm öncesi pencere */
.rib{position:relative;margin:-38px auto 6px;width:82%;height:52px;display:grid;place-items:center;background:linear-gradient(#3aa6ea,#1677b8);border-radius:14px;box-shadow:0 6px 0 #0c4f80,inset 0 3px 0 rgba(255,255,255,.35);overflow:hidden}
.rib span{color:#fff;font-size:27px;font-weight:900;text-shadow:0 3px 0 rgba(0,40,80,.4)}
.rib::after{content:'';position:absolute;top:0;left:-50%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.plv.t1 .rib{background:linear-gradient(#ffab4d,#e57a12);box-shadow:0 6px 0 #a35d0e,inset 0 3px 0 rgba(255,255,255,.35)}
.plv.t2 .rib{background:linear-gradient(#ff6b6b,#d6333c);box-shadow:0 6px 0 #8f1c22,inset 0 3px 0 rgba(255,255,255,.35)}
.plv.t1,.plv.t2{border-top:none!important;padding-top:0!important}
.an{animation:fadeup .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px) scale(.96)}}
.plvinfo span{background:linear-gradient(#fff,#eaf1f6)!important;box-shadow:0 4px 0 #c3d0db,inset 0 2px 0 #fff}
.wig{font-style:normal;font-size:22px;display:inline-block;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.bob{display:inline-flex;align-items:center;animation:bobi 1.8s ease-in-out infinite}
@keyframes bobi{50%{transform:translateY(-4px)}}
.stars-o{display:inline-flex;gap:2px;vertical-align:middle}
.sto{width:20px;height:20px;animation:twk2 2s ease-in-out infinite}.sto:nth-child(2){animation-delay:.3s}.sto:nth-child(3){animation-delay:.6s}
@keyframes twk2{50%{transform:scale(1.18) rotate(8deg)}}
.tpill{box-shadow:0 3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.4)}

.pill.life{background:linear-gradient(#fff,#ffe3e6);color:#c0263a;display:flex;gap:4px;padding:0 10px;cursor:pointer}
.pill.life small{font-size:10.5px;font-weight:800;color:#7a8b99;margin-left:2px}
.hrts{display:flex;justify-content:center;gap:4px;font-size:30px}.hrt{filter:grayscale(1) opacity(.35)}.hrt.on{filter:none;animation:bobi 1.6s ease-in-out infinite}
.plife{color:#c0263a;font-weight:900}
.presec{font-size:12px;font-weight:900;color:#5a6f80;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}
.pres{display:flex;gap:6px;margin-bottom:10px}
.pre{flex:1;position:relative;border:0;border-radius:14px;padding:7px 2px;background:linear-gradient(#fff,#eaf1f6);box-shadow:0 4px 0 #c3d0db,inset 0 2px 0 #fff;font-family:inherit;color:#10263a;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.pre i{font-style:normal;font-size:22px}.pre b{font-size:11px}.pre span{font-size:11px;font-weight:900;color:#7a4a00}
.pre em{display:none;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#2fb36b;color:#fff;font-style:normal;font-size:12px;font-weight:900;place-items:center}
.pre.on{background:linear-gradient(#e9fbef,#c9f0d6);box-shadow:0 4px 0 #2fb36b,0 0 0 2px #2fb36b,inset 0 2px 0 #fff}.pre.on em{display:grid}
.pre:disabled{opacity:.4}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.skin{border:0;border-radius:16px;padding:8px 6px 10px;background:linear-gradient(#fff,#eef3f7);box-shadow:0 5px 0 #9fb3c3,inset 0 2px 0 #fff;font-family:inherit;color:#10263a;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.skin.cur{box-shadow:0 5px 0 #c99a00,0 0 0 3px #ffd84d,inset 0 2px 0 #fff}
.skp{width:150px;height:62px;position:relative;overflow:hidden}.skp .fsvg{width:190px;height:96px;transform:scale(.72);transform-origin:top left;position:absolute;left:6px;top:-4px}
.skin b{font-size:13.5px}.skin span{font-size:12px;font-weight:900;color:#7a4a00}.skin.cur span{color:#1e7f4a}

.tile.obs{background:linear-gradient(#8a6a4a,#6b4f34)!important;box-shadow:inset 0 3px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.25)!important;display:grid;place-items:center}
.tile.obs::after{font-size:calc(100% + 10px);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.tile.obs.o0{background:repeating-linear-gradient(45deg,#f5c518 0 8px,#2b2b2b 8px 16px)!important}
.tile.obs.o0::after{content:'🚧';font-size:26px}.tile.obs.o1::after{content:'🧳';font-size:26px}.tile.obs.o2::after{content:'📦';font-size:26px}
.fig .lkb,.fig .kyb{position:absolute;font-style:normal;font-size:calc(var(--s,44px)*.32);right:-4%;top:-4%;width:calc(var(--s,44px)*.42);height:calc(var(--s,44px)*.42);border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 2.5px var(--pc,#f5c518);z-index:2}
.fig .p0{--pc:#f5c518}.fig .p1{--pc:#c0c7cf}.fig .p2{--pc:#cd7f32}
.fig .kyb{animation:bobi 1.4s ease-in-out infinite}
.fig .chn{position:absolute;left:10%;right:10%;top:52%;height:16%;background:repeating-linear-gradient(90deg,#9aa4ad 0 5px,#5f6a74 5px 7px);border-radius:4px;transform:rotate(-12deg);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.fig.lockd{filter:saturate(.6) brightness(.9)}
.mini.fogm{opacity:.55}.mini.fogm::before{content:'?';position:absolute;left:0;right:0;top:-3px;text-align:center;font-size:11px;font-weight:900;color:#fff}
.feats{display:flex;flex-direction:column;gap:6px;margin:-2px 0 10px;text-align:left}
.feat{display:flex;align-items:center;gap:10px;background:linear-gradient(#fff7e6,#ffecc2);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 #e2c27a,inset 0 2px 0 #fff}
.feat i{font-style:normal;font-size:22px}.feat b{display:block;font-size:13px;color:#7a4a00}.feat span{font-size:11.5px;color:#7a6a50;font-weight:600}
.newb{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);text-decoration:none;white-space:nowrap;font-size:10px;font-weight:900;color:#fff;background:linear-gradient(#ff6b9d,#d6336c);border-radius:8px;padding:2px 6px;box-shadow:0 2px 0 #8f1c45}
.stbl{max-height:46vh;overflow:auto;margin-bottom:10px;border-radius:12px;box-shadow:inset 0 0 0 1px #e3eaf0}.stbl table{width:100%;border-collapse:collapse;font-size:13px}.stbl th{position:sticky;top:0;background:#eef3f7;padding:6px 4px;font-size:11.5px}.stbl td{padding:5px 4px;border-top:1px solid #eef2f5;font-weight:700}
.replay{background:linear-gradient(#eef7ff,#d8ecfb);border-radius:12px;padding:7px 10px;margin:-4px 0 10px;font-weight:900;font-size:14px;color:#0d4f82;box-shadow:0 3px 0 #a9cbe6,inset 0 2px 0 #fff}.replay span{display:block;font-size:11.5px;font-weight:700;color:#5a6f80}
.rate{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}.rate button{border:0;background:none;font-size:32px;cursor:pointer;color:#f0a020}.fbm{width:100%;min-height:90px;border-radius:12px;border:2px solid #dfe7ee;padding:10px;font-family:inherit;font-size:14px;margin-bottom:10px;resize:vertical;user-select:text;-webkit-user-select:text}.btn.wa{display:block;text-decoration:none;text-align:center;margin-top:10px;background:linear-gradient(#3ee07a,#1fa855);box-shadow:0 5px 0 #157a3d,inset 0 2px 0 rgba(255,255,255,.4)}
.tgo{display:flex;gap:8px;padding:10px 0 4px}.tgo input{flex:1;min-width:0;border:2px solid #dfe7ee;border-radius:12px;padding:8px 10px;font-size:16px;font-family:inherit;user-select:text;-webkit-user-select:text}
.lgs{display:flex;gap:6px}.lg{border:0;border-radius:10px;padding:6px 12px;font-weight:900;font-family:inherit;background:#e3eaf0;color:#5a6f80;cursor:pointer}.lg.on{background:#1d8cce;color:#fff;box-shadow:0 3px 0 #0f5f8f}

.perk{display:flex;align-items:center;gap:10px;border-radius:16px;padding:9px 12px;margin:12px 0 0;background:linear-gradient(#fff7e0,#ffe9b0);color:#5a3a00;box-shadow:0 4px 0 #d9b24a,inset 0 2px 0 #fff;text-align:left}
.perk i{font-style:normal;font-size:28px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}.perk b{display:block;font-size:13.5px}.perk span{font-size:12px;font-weight:700;color:#7a5a20}
.perk.own{background:linear-gradient(#ecfbf2,#cdf2dc);color:#145c35;box-shadow:0 4px 0 #6cc092,inset 0 2px 0 #fff}.perk.own span{color:#2c7a50}
.card .perk{margin:0 0 14px}
.chip.pk{background:#fff1c7;color:#7a4a00;animation:none;margin-bottom:2px}
.gate{display:flex;align-items:center;gap:10px;margin:0 14px 8px;padding:10px 12px;border-radius:16px;background:linear-gradient(#fff,#ffe3e6);color:#7a1d2a;box-shadow:0 5px 0 #d98a95,inset 0 2px 0 #fff}
.gate i{font-style:normal;font-size:26px}.gate div{flex:1}.gate b{display:block;font-size:14px}.gate span{font-size:12px;font-weight:700;color:#8a4a55}
.playbtn.gateb{background:linear-gradient(#ffc04d,#f08a1c);box-shadow:0 6px 0 #a35d0e,0 10px 20px rgba(0,0,0,.25)}

/* --- v0.16 canlı görseller --- */
#sea{background:linear-gradient(var(--s1) 0%,var(--s2) 44%,var(--w1) 44%,var(--w2) 100%)}
.swv{position:absolute;left:0;width:200%;height:26px;background-repeat:repeat-x;background-size:120px 26px;animation:swv 7s linear infinite;pointer-events:none}

/* yolcular: chibi 2.5D */

.fig .mo{position:absolute;left:43%;top:33%;width:14%;height:5%;border-bottom:2px solid #8a3b2a;border-radius:0 0 50% 50%}

.fig .cap{top:-2%;left:22%;width:56%}

.trail{position:absolute;width:10px;height:10px;border-radius:50%;opacity:0;pointer-events:none;z-index:2;animation:trail .5s ease-out forwards;box-shadow:0 0 6px currentColor}

.spk2{position:absolute;font-size:12px;font-weight:900;pointer-events:none;z-index:6;animation:spk2 .55s ease-out forwards;text-shadow:0 0 4px rgba(255,255,255,.8)}

.cfly{position:absolute;font-size:24px;z-index:12;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

.rsea{position:absolute;top:0;bottom:0;left:calc(180px - min(50vw,240px));width:min(100vw,480px);background:none center top/100% auto repeat;z-index:0!important;overflow:hidden;pointer-events:none}
.rsea::before,.rsea::after{content:'';position:absolute;inset:-40px;background:none 0 0/100% auto repeat;opacity:.3;mix-blend-mode:screen;animation:seaw 9s ease-in-out infinite alternate}
.rsea::after{background-size:115% auto;opacity:.16;animation:seaw2 13s ease-in-out infinite alternate}
.rin>*:not(.rsea){z-index:1}
@keyframes seaw{from{transform:translate(0,0)}to{transform:translate(24px,16px)}}
@keyframes seaw2{from{transform:translate(0,0)}to{transform:translate(-20px,22px)}}
.risl{animation:none!important}
.rboat2{position:absolute;width:60px;pointer-events:none;animation:bobb 2.6s ease-in-out infinite}
.rboat2 img{width:100%;display:block;filter:drop-shadow(0 4px 2px rgba(0,50,70,.3))}
.risl{filter:drop-shadow(0 0 2px rgba(255,255,255,.85)) drop-shadow(0 5px 4px rgba(0,60,80,.3))!important}
.rchest{width:58px!important}.ndferry.rt{left:62px!important}

/* ---- dükkân (k03) ---- */
#menu.shopV{background:linear-gradient(rgba(255,170,110,.25),rgba(90,50,80,.35)),url(assets/m_bg3.webp) center 40%/cover no-repeat!important}
#menu.shopV .mbg{display:none}
#tab-shop{padding:0!important}
.shv{position:relative;padding:0 8px 16px}
.shtop{position:relative;height:112px;margin:0 -8px}
.shawn{position:absolute;left:0;right:0;top:-4px;width:100%;height:96px;object-fit:fill;filter:drop-shadow(0 6px 4px rgba(60,20,10,.35))}
.shl{position:absolute;top:62px;width:46%;opacity:.95;animation:twk 2.4s ease-in-out infinite}
.shl.l{left:-4%}.shl.r{right:-4%;transform:scaleX(-1);animation-delay:-1.2s}
@keyframes twk{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 6px #ffe39a)}}
.shsign{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:190px;z-index:2;animation:signsw 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes signsw{0%,100%{transform:translateX(-50%) rotate(-1.2deg)}50%{transform:translateX(-50%) rotate(1.2deg)}}
.shsign img{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(40,15,5,.4))}
.shsign b{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-size:30px;font-weight:900;letter-spacing:1px;color:#fff6e4;text-shadow:0 3px 0 #8a4f2a,0 -1px 0 #5a2f15,2px 0 0 #5a2f15,-2px 0 0 #5a2f15,0 5px 4px rgba(0,0,0,.35)}
.shframe{position:relative;margin-top:-4px;background:linear-gradient(#8d5a35,#6e4226);border-radius:22px;padding:14px 10px 12px;box-shadow:inset 0 0 0 4px #a7703f,inset 0 0 0 7px #5c3519,0 8px 0 #4a2a14,0 12px 18px rgba(0,0,0,.35)}
.shoffer{position:relative;display:block;width:100%;height:132px;border:0;border-radius:18px;font-family:inherit;cursor:pointer;background:radial-gradient(circle at 75% 45%,#f7a23a 0,#e4502b 45%,#b9222a 100%);box-shadow:inset 0 0 0 4px #ffcf5a,inset 0 0 0 6px #b06a10,0 5px 0 #5a2a10;overflow:hidden;text-align:left}
.shrib{position:absolute;left:-4px;top:16px;padding:6px 22px 6px 14px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ffcf4a,#e39a12);clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%);text-shadow:0 2px 0 #a25a00;box-shadow:0 3px 0 #8a4a00}
.shoi{position:absolute;left:14px;top:56px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 0 #7a1010}
.shchest{position:absolute;right:30px;top:6px;width:122px;animation:chb 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 5px rgba(80,10,0,.4))}
@keyframes chb{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.shofer{position:absolute;right:4px;bottom:4px;width:60px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.shsp{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk 1.8s ease-in-out infinite}
.shsp.s1{right:140px;top:18px}.shsp.s2{right:28px;top:20px;animation-delay:-.6s}.shsp.s3{right:96px;top:88px;animation-delay:-1.2s}
@keyframes spk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.shpb{display:inline-block;font-style:normal;font-weight:900;color:#fff;border-radius:14px;padding:6px 14px;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap}
.shpb.g{background:linear-gradient(#7fdc4f,#33a12c);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #1f6e1a}
.shpb.b{background:linear-gradient(#5fb2ff,#1f6fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #134a9a}
.shpb.gd{background:linear-gradient(#ffd85a,#f0a510);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #a56a00;font-size:13px}
.shpb.or{position:absolute;left:18px;bottom:16px;font-size:20px;padding:7px 28px;background:linear-gradient(#ffa64a,#f05a14);box-shadow:inset 0 0 0 3px #ffe0a8,0 4px 0 #9a2e05;animation:pbp 1.6s ease-in-out infinite}
@keyframes pbp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.shfree{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:10px 0 0;border:0;border-radius:14px;padding:8px;font-family:inherit;font-size:14px;font-weight:900;color:#5a3215;background:linear-gradient(#fff4dc,#f3dfb8);box-shadow:0 4px 0 #c9a46f;cursor:pointer}
.shfree span{background:#33a12c;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.shc{position:relative;border:0;border-radius:18px;padding:10px 6px 12px;font-family:inherit;cursor:pointer;background:linear-gradient(#fff8ea,#f6e6c8);box-shadow:inset 0 2px 0 #fff,0 5px 0 #d4b281;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a2e14}
.shc b{font-size:15px;font-weight:900}
.shc img{height:66px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(90,50,10,.25))}
.shc small{font-size:12px;font-weight:900;color:#8a5a2a}
.shbi{display:flex;gap:2px;height:66px;align-items:center}.shbi img{height:46px}
.shbest{position:absolute;top:-6px;right:-4px;background:#e4502b;color:#fff;font-size:11px;font-weight:900;text-decoration:none;padding:3px 8px;border-radius:10px;transform:rotate(8deg);box-shadow:0 2px 0 #8a2a10}
.shskins{margin-top:14px;background:rgba(60,30,12,.45);border-radius:18px;padding:8px 8px 12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.shskins h4{margin:2px 0 8px;text-align:center;color:#fff3dc;font-size:17px;font-weight:900;text-shadow:0 2px 0 #4a2a14}
.skrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skc{border:0;border-radius:16px;padding:6px 4px 10px;font-family:inherit;cursor:pointer;background:linear-gradient(#fff8ea,#f6e6c8);box-shadow:inset 0 2px 0 #fff,0 4px 0 #d4b281;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a2e14}
.skc.cur{box-shadow:0 0 0 3px #ffd84d,inset 0 2px 0 #fff,0 4px 0 #c99a00}
.skc b{font-size:11.5px;font-weight:900;line-height:1.1;min-height:26px;display:flex;align-items:center;text-align:center}
.skst{position:relative;width:100%;height:84px}
.skped{position:absolute;left:12%;right:12%;bottom:0;width:76%}
.skf{position:absolute;left:50%;bottom:16px;width:78%;transform:translateX(-50%);animation:skb 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(60,30,10,.3))}
.skc:nth-child(2n) .skf{animation-delay:-1.3s}
@keyframes skb{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.skc .shpb{font-size:12.5px;padding:5px 9px}
.shv .snote{color:#ffeccc;text-align:center;font-size:11px;margin:10px 0 0;opacity:.8}
/* oyunda vapur kaplaması */
#ferry.sprf .skimg{object-fit:contain;object-position:50% 100%}
#ferry.sprf .skseats{background:var(--c);box-shadow:0 0 0 2px #fff,0 3px 0 rgba(0,0,0,.25)}
#ferry.sprf .skseats .seat{background:rgba(255,255,255,.55)!important}
#ferry.sprf .skseats .seat.on{background:#fff!important;box-shadow:0 0 0 2px var(--d),inset 0 -2px 0 rgba(0,0,0,.15)}
#ferry.sprf .fsh.skc2_old{background:var(--c);opacity:.85;height:18px;bottom:0;filter:blur(3px);box-shadow:0 0 14px 4px var(--c)}
#ferry.sprf .skseats{transform:translateX(-50%) scale(1.15);transform-origin:50% 100%}

#ferry.sprf .skband{position:absolute;inset:0;background:var(--c);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:50% 100%;mask-position:50% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;pointer-events:none}
#ferry.sprf .skband.sh{background:var(--d)}
#ferry.sprf .skseats{bottom:16%!important}
#sea.ist::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(rgba(78,196,198,0),rgba(78,196,198,.95));pointer-events:none;z-index:0}

#ferry.sprf .skband{background:linear-gradient(rgba(255,255,255,.55) 0,rgba(255,255,255,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.28) 100%),var(--c)!important}
#ferry.sprf .skmid{display:none}
#ferry.sprf .skseats{bottom:auto!important;left:52%!important;transform:translate(-50%,-50%)!important;background:none!important;box-shadow:none!important;padding:0!important;gap:6px}
#ferry.sprf .skseats .seat{width:13px;height:13px;background:rgba(255,255,255,.5)!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
#ferry.sprf .skseats .seat.on{background:#fff!important;box-shadow:0 0 0 2px var(--d)}

/* v4 maskot vapur */
#ferry.sprf{aspect-ratio:320/257!important;height:80%!important}
#ferry.sprf .seats{left:47%!important;bottom:4%!important;transform:translateX(-50%)!important;background:rgba(255,255,255,.88)!important;box-shadow:0 2px 0 rgba(0,0,0,.18),0 0 0 2px var(--c)!important;padding:3px 7px!important}
#ferry.sprf .seat{background:rgba(20,40,70,.18)!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)!important}
#ferry.sprf .seat.on{background:var(--c)!important;box-shadow:0 0 0 2px #fff,0 1px 2px rgba(0,0,0,.3)!important}
#ferry.sprf .smoke{left:60%!important;bottom:92%!important}

.shbi{width:100%;justify-content:center;gap:4px!important;height:66px}
.shbi img{width:30%!important;max-width:54px;height:auto!important;object-fit:contain}
.shc{min-width:0;overflow:hidden}.shc b{max-width:100%;font-size:clamp(12px,3.6vw,15px)}

/* ---- ikonlar ---- */
img.ei{height:1.2em;width:auto;vertical-align:-.24em;display:inline-block;margin:0 .06em;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
img.ei.eif{height:1.35em;vertical-align:-.3em}
/* ---- tenteli pencere (yeni dil) ---- */
#modal{background:rgba(20,30,50,.55)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#card.dressed{position:relative;overflow:visible!important;background:linear-gradient(#fff8ea,#f6e6c8)!important;border:7px solid #8d5a35!important;border-radius:26px!important;box-shadow:inset 0 0 0 3px #f7e4c0,0 0 0 3px #5c3519,0 9px 0 #4a2a14,0 20px 36px rgba(0,0,0,.45)!important;padding:78px 18px 18px!important;color:#5a2e14!important;max-width:360px;width:100%}
#card.dressed .mhead{position:absolute;left:-14px;right:-14px;top:-38px;height:120px;pointer-events:none}
#card.dressed .mawn{position:absolute;left:0;right:0;top:0;width:100%;height:62px;object-fit:fill;filter:drop-shadow(0 5px 4px rgba(60,20,10,.35))}
#card.dressed .mrib{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:86%;max-width:330px}
#card.dressed .mrib img{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(60,20,10,.35))}
#card.dressed .mrib span{position:absolute;left:12%;right:12%;top:46%;transform:translateY(-50%);text-align:center;font-weight:900;font-size:clamp(16px,5vw,21px);line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(90,20,10,.55),0 0 6px rgba(0,0,0,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card.dressed .mrib.gold span{text-shadow:0 2px 0 rgba(130,70,0,.6)}
#card.dressed .mrib.blue span{text-shadow:0 2px 0 rgba(20,40,90,.6)}
#card.dressed .mrib span .ei{height:1em}
#card.dressed > .em{display:none}
#card.dressed p{color:#6b4024}
#card.dressed .note{color:#8a6a4a}
#card.dressed .btn{border-radius:18px;font-size:18px;font-weight:900;padding:13px 14px;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.2px;border:2px solid rgba(255,255,255,.55)}
#card.dressed .btn{background:linear-gradient(#5fb2ff,#1f6fe0)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #134a9a,0 7px 8px rgba(0,0,0,.2)!important;color:#fff!important}
#card.dressed .btn.gold{background:linear-gradient(#86e052,#33a12c)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #1f6e1a,0 7px 8px rgba(0,0,0,.2)!important}
#card.dressed .btn.alt{background:linear-gradient(#fffaf0,#efdcb8)!important;color:#7a4a22!important;text-shadow:none;box-shadow:inset 0 2px 0 #fff,0 5px 0 #c9a46f!important}
#card.dressed .btn:active{transform:translateY(3px)}
#card.dressed .plv{margin-top:-6px}
#card.dressed .tpill{display:inline-block}
#card.dressed .stars3{margin-top:4px}
#card.dressed .stars3 .ei{height:2.2em}

#card.dressed{padding-top:104px!important}
#card.dressed .mrib{top:34px;width:80%}
#card.dressed .plv{margin-top:-10px}

#card.dressed .plvinfo span,#card.dressed .feat,#card.dressed .pre{background:linear-gradient(#fffaf0,#f8ead0)!important;border:2px solid #ead2a8!important;box-shadow:0 3px 0 #d9bb8a!important;color:#5a2e14!important}
#card.dressed .feat span,#card.dressed .plvinfo span span{color:#8a5a2a!important}
#card.dressed .pre.on{border-color:#4fbf3a!important;box-shadow:0 0 0 3px #86e052,0 3px 0 #2f8a26!important}
#card.dressed .presec{color:#8a5a2a!important}
#card.dressed .tpill{background:#f3dfb8!important;color:#7a4a22!important}
#card.dressed .tpill.t1{background:#ffd27a!important;color:#7a3f00!important}
#card.dressed .tpill.t2{background:#ff8a5c!important;color:#fff!important}
#modal{overflow-y:auto!important;align-items:flex-start!important;padding:52px 20px 24px!important;-webkit-overflow-scrolling:touch}
#card{margin:auto!important}
@media (max-height:720px){#card.dressed .feats{display:none}#card.dressed .plvb{display:none}#card.dressed .feat span{display:none}#card.dressed .feat{padding-top:6px!important;padding-bottom:6px!important}}

/* ---- oyun yazı tipi ---- */
body,button,input,textarea{font-family:'Fredoka',system-ui,-apple-system,sans-serif!important}
body{font-weight:500}
b,strong,h1,h2,h3,.btn{font-weight:700}
.shsign b,.shrib,.shskins h4,.rhead b,.chead b{font-family:'Lilita One','Fredoka',sans-serif!important;font-weight:400!important;letter-spacing:.5px}
#card.dressed .btn{font-weight:700;letter-spacing:.3px}
#card.dressed .mrib span{display:none}
#card.dressed .mrib svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#card.dressed .mrib svg text{font-family:'Lilita One','Fredoka',sans-serif;fill:#fff;paint-order:stroke;stroke-width:7px;stroke-linejoin:round;letter-spacing:.5px}
#card.dressed .mrib.red svg text{stroke:#8e1e18}
#card.dressed .mrib.gold svg text{stroke:#9a5a00}
#card.dressed .mrib.blue svg text{stroke:#2a3f73}
#card.dressed .mrib{width:92%!important;max-width:360px!important}

/* ---- ana sayfa vektör ---- */

.pbtn.pbv2 svg{position:absolute;inset:0;width:100%;height:100%}

/* artı işareti fonttan bağımsız */
.pill em,.coin em{position:relative;font-size:0!important;line-height:0!important;color:transparent!important;flex:none}
.pill em::before,.pill em::after,.coin em::before,.coin em::after{content:'';position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}

.pill em::after,.coin em::after{width:16%;height:52%}

#queue>div:first-child{font-family:'Lilita One','Fredoka',sans-serif;font-weight:400;font-size:12px;color:var(--br);text-shadow:none;letter-spacing:.3px}
#queue .row{gap:5px!important}
#queue .mini.spr{width:40px!important;height:32px!important;border-radius:9px!important;background-color:#fff!important;background-size:86% auto!important;background-position:center 35%!important;box-shadow:inset 0 -7px 0 var(--c),0 0 0 2px #fff,0 0 0 3.5px rgba(160,124,74,.55)!important}
#queue .mini.spr:first-child{width:44px!important;height:36px!important}
#queue .mini.spr.fz{box-shadow:inset 0 -7px 0 #9aa7b2,0 0 0 2px #fff,0 0 0 3.5px rgba(160,124,74,.55)!important}
/* vapurdaki koltuk göstergesi */
#ferry.sprf .seats{background:linear-gradient(var(--cr1),var(--cr2))!important;border:2px solid var(--gd);box-shadow:0 3px 0 var(--gd2)!important;padding:4px 7px!important;gap:6px!important;border-radius:14px!important;bottom:2%!important}
#ferry.sprf .seat{width:20px!important;height:20px!important;border-radius:50%!important;background:#e6d3ae!important;box-shadow:inset 0 2px 3px rgba(90,60,30,.35)!important;position:relative!important;top:0!important;left:auto!important}
#ferry.sprf .seat.on{background:radial-gradient(circle at 50% 36%,#ffe2c6 0 26%,transparent 28%),radial-gradient(ellipse at 50% 100%,#fff 0 30%,transparent 32%),var(--c)!important;box-shadow:0 0 0 2px #fff,0 2px 3px rgba(0,0,0,.3)!important}
/* bekleme alanı */
#benchwrap{position:relative}
#bcnt{position:absolute;left:50%;transform:translateX(-50%);top:calc(min(100vw,480px)*.16 - 24px);z-index:3;background:linear-gradient(var(--cr1),var(--cr2));border:2px solid var(--gd);box-shadow:0 3px 0 var(--gd2);border-radius:12px;padding:1px 10px 2px;font-family:'Lilita One','Fredoka',sans-serif;font-size:12.5px;color:var(--br);white-space:nowrap;transition:background .3s}
#bcnt b{font-weight:400}
#benchwrap.warn #bcnt{background:linear-gradient(#ffe0a8,#ffc266);border-color:#e08a1e;color:#7a3d00;animation:bwarn 1s ease-in-out infinite}
#benchwrap.full #bcnt{background:linear-gradient(#ff8a8a,#e5484d);border-color:#a5121d;color:#fff;animation:bwarn .6s ease-in-out infinite}
@keyframes bwarn{50%{transform:translateX(-50%) scale(1.08)}}
#app .slot{flex:0 1 54px!important;aspect-ratio:1;border-radius:16px!important;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.0) 0 40%,rgba(0,0,0,0) 41%),linear-gradient(#fff3d9,#efd6a6)!important;box-shadow:0 0 0 2px var(--gd),0 4px 0 2px var(--gd2),inset 0 -6px 0 rgba(160,124,74,.25),0 6px 8px rgba(40,20,0,.3)!important;filter:none!important;border:0!important}
#app .slot::after{content:''!important;position:absolute;left:22%;right:22%;top:30%;bottom:22%;margin:0!important;width:auto!important;height:auto!important;background:url(assets/q_seat.webp) center/contain no-repeat!important;opacity:.35;border-radius:0}
#benchwrap.warn .slot{box-shadow:0 0 0 2px #e08a1e,0 4px 0 2px #a35d10,inset 0 -6px 0 rgba(160,124,74,.25),0 6px 8px rgba(40,20,0,.3)!important}
#benchwrap.full .slot{box-shadow:0 0 0 2.5px #e5484d,0 4px 0 2px #a5121d,0 0 14px rgba(229,72,77,.7)!important;filter:none!important}
/* iskele zemini + tahta */
#pier{background:radial-gradient(ellipse at 50% 40%,rgba(255,220,170,.12),rgba(60,34,14,.55) 90%),url(assets/bg_planks.webp) center top/100% auto repeat-y!important}
#grid{transform:perspective(1000px) rotateX(7deg)!important;border:0!important;border-image:none!important;border-radius:22px!important;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0) 30%),repeating-linear-gradient(180deg,#e9be84 0 22px,#d9a96c 22px 24px)!important;box-shadow:0 0 0 5px #fff4dc,0 0 0 9px var(--gd),0 10px 0 7px var(--gd2),0 18px 26px rgba(30,15,0,.45),inset 0 6px 10px rgba(120,70,20,.25)!important}

#app .tile{background:radial-gradient(ellipse 46% 40% at 50% 60%,#fffaf0 0 55%,#f4dfba 75%,#dcb57c 96%,rgba(220,181,124,0) 100%)!important;box-shadow:none!important;border-radius:50%!important;transition:background .25s}
#app .tile.emp{background:radial-gradient(ellipse 40% 34% at 50% 60%,rgba(120,72,28,.28) 0 70%,rgba(120,72,28,.1) 90%,rgba(120,72,28,0) 100%)!important}
#app .tile.rc{background:radial-gradient(ellipse 46% 40% at 50% 60%,#fffbe8 0 52%,#ffe48a 70%,#f2b630 88%,rgba(242,182,48,0) 100%)!important}
#app .tile.obs{border-radius:12px!important;background:radial-gradient(ellipse 46% 40% at 50% 62%,rgba(90,55,25,.35) 0 70%,rgba(90,55,25,0) 100%)!important}
#app .tile.obs::after{inset:2%!important;filter:drop-shadow(0 3px 2px rgba(60,30,5,.4))}
.fig.blk{filter:brightness(.6) saturate(.6)!important;opacity:1!important}
.fig.blk .pi{filter:none!important}
.fig.lockd{filter:brightness(.68) saturate(.55)!important}
.fig .lkb,.fig .kyb{width:calc(var(--s,44px)*.5)!important;height:calc(var(--s,44px)*.5)!important;right:-10%!important;top:-8%!important;background:radial-gradient(circle at 40% 35%,#fffaf0,#f1dcb3)!important;box-shadow:0 0 0 2px var(--pc,#f5c518),0 2px 3px rgba(0,0,0,.35)!important;z-index:3;filter:none}
/* güçlendiriciler */
#boosters{gap:clamp(14px,6vw,28px)!important;padding-top:10px!important}
#app .bst{width:72px!important;height:auto!important;background:none!important;box-shadow:none!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:5px;padding:0!important;font-family:'Lilita One','Fredoka',sans-serif!important;font-weight:400!important;font-size:12.5px!important;color:#fff!important;text-shadow:0 2px 0 #4a2a10,0 0 3px #4a2a10!important;opacity:1!important}
#app .bst::before{display:none!important}
#app .bst .ic{display:grid!important;place-items:center;width:58px;height:58px;border-radius:50%;box-shadow:0 0 0 3px #fff4dc,0 0 0 5px var(--gd),0 5px 0 3px var(--gd2),0 8px 10px rgba(0,0,0,.35);transition:transform .15s}
#app #b_undo .ic{background:radial-gradient(circle at 38% 30%,#ffb08a,#f0643c 58%,#b8381a)}
#app #b_extra .ic{background:radial-gradient(circle at 38% 30%,#b6f08a,#4fb83a 58%,#2c7f1f)}
#app #b_magnet .ic{background:radial-gradient(circle at 38% 30%,#e3b6ff,#a35ce0 58%,#6c2fa3)}
#app .bst .ic img{width:68%;height:68%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}#app #b_extra .ic img{width:60%;height:60%}
#app .bst:active .ic{transform:translateY(3px)}
#app .bst.off .ic{filter:saturate(.35) brightness(.92)}
#app .bst.off{color:#e8dccb!important}
#app .bst .badge{top:-4px!important;right:2px!important;min-width:24px;height:24px;border-radius:12px;padding:0 6px;display:grid;place-items:center;background:linear-gradient(#ff6b6b,#e5484d)!important;border:2px solid #fff;box-shadow:0 2px 3px rgba(0,0,0,.3);font-family:'Lilita One','Fredoka',sans-serif;font-size:13px;color:#fff;text-shadow:none!important;line-height:1}
#app .bst .badge.price{background:linear-gradient(#ffe98a,#f4b62a)!important;color:#6b3a00;font-size:11.5px}
/* yardım baloncuğu */
#cbub{background:linear-gradient(var(--cr1),#f7e7c8)!important;color:#5a3a19!important;border:3px solid var(--gd);box-shadow:0 5px 0 var(--gd2),0 12px 24px rgba(0,0,0,.35)!important;border-radius:20px!important;font-size:15.5px!important;font-weight:700}
#cbub b{color:#c8302a}
#cbub .btn{margin-top:12px;font-family:'Lilita One','Fredoka',sans-serif;font-weight:400;font-size:17px;border-radius:16px}
#spot{box-shadow:0 0 0 4px #ffd84d,0 0 0 9999px rgba(10,20,35,.55),0 0 22px 6px rgba(255,216,77,.8)!important}
/* bildirim */
#toast{border-radius:16px!important;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.25)!important;font-family:'Lilita One','Fredoka',sans-serif;font-weight:400!important;font-size:15px!important;letter-spacing:.2px}

#app #sea{height:calc(clamp(108px,18vh,170px) + 60px + var(--sat,env(safe-area-inset-top)))!important}
#app #benchwrap{padding-top:calc(min(100vw,480px)*.115)!important;padding-bottom:6px!important;background-position:center calc(min(100vw,480px)*-.045),center top!important}
#bcnt{top:calc(min(100vw,480px)*.115 - 22px)!important}
#ferry.sprf .seats{border-color:var(--c)!important}
#ferry.sprf .seat{background:#d8c094!important;box-shadow:inset 0 2px 3px rgba(90,60,30,.45),0 0 0 1.5px rgba(255,255,255,.7)!important}
#boosters{padding-top:6px!important}
#app .bst .ic{width:54px;height:54px}
#app #pier{padding-top:4px!important}

#app #gridbox{align-items:center!important;padding-top:4px}
#app>header .ttl span{display:block;white-space:nowrap;overflow:visible;text-overflow:clip}

#app>header .ttl .ttg{display:inline-block;font-style:normal;font-size:.82em;color:#fff;border-radius:8px;padding:0 6px 1px;margin-right:5px;vertical-align:1px}
.ttg.t1{background:linear-gradient(#8fa3b8,#5d7189)}.ttg.t2{background:linear-gradient(#6f6a8f,#3d3858)}

#app #count{display:none!important}
#app #queue{z-index:4;min-width:150px}
#queue>div:first-child{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%}
#queue .qt{display:flex;align-items:center;justify-content:center;gap:3px;font-family:'Lilita One','Fredoka',sans-serif;font-size:12.5px;color:var(--br)}
#queue .qt .ei{width:16px;height:16px}
#queue .qb{display:block;height:6px;border-radius:4px;background:#e3cfa6;box-shadow:inset 0 1px 2px rgba(90,60,30,.35);overflow:hidden;margin:0 4px 2px}
#queue .qb s{display:block;height:100%;border-radius:4px;background:linear-gradient(#9fe36a,#4fb83a);transition:width .5s}
#queue .qlast{font-family:'Lilita One','Fredoka',sans-serif;font-size:13px;color:#c8302a;text-align:center;padding:6px 4px}
#app #ferry.sprf{--fh:calc(clamp(108px,18vh,170px)*1.0);height:var(--fh)!important;width:calc(var(--fh)*1.245)!important;left:calc(40px + var(--fh)*.62)!important;bottom:4px!important;z-index:2}
#app #ferry.sprf .seats{left:62%!important;bottom:3%!important;transform:translateX(-50%) scale(.85)!important}

/* v0.69 iskele kenarı: bolardlar denize taşar, kesik yok */
#app #benchwrap{background:url(assets/bg_planks.webp) center top/100% auto repeat-y!important;padding-top:calc(min(100vw,480px)*.155)!important;padding-bottom:8px!important;overflow:visible!important;z-index:3}
#app #benchwrap::before{content:'';position:absolute;left:0;right:0;top:calc(min(100vw,480px)*-.103);height:calc(min(100vw,480px)*.3);background:url(assets/bg_edge4.webp) center top/100% 100% no-repeat;pointer-events:none;z-index:0}
#app #benchwrap::after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(rgba(40,20,5,.45),rgba(40,20,5,0));pointer-events:none;z-index:1}
#app #bench{position:relative;z-index:2}
#app #bcnt{top:calc(min(100vw,480px)*.155 - 24px)!important;z-index:3}
#app #sea{z-index:1}

/* v0.70 animasyonlar */
#ferry.sprf .fimg{transform-origin:50% 85%}
#ferry.fpuff .smoke{animation:smkp .9s ease-out infinite!important;width:16px;height:16px;background:rgba(255,255,255,.95)}
#ferry.fpuff .smoke.s2{animation-delay:-.3s!important}#ferry.fpuff .smoke.s3{animation-delay:-.6s!important}
@keyframes smkp{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-34px) scale(2.4)}}
.fwake{position:absolute;height:14px;margin-top:-7px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 20% 50%,rgba(255,255,255,.95),rgba(255,255,255,.4) 45%,rgba(255,255,255,0) 70%);transform-origin:0 50%;animation:fwake 1.3s ease-out forwards}
@keyframes fwake{0%{opacity:0;transform:scaleX(.3)}20%{opacity:1}100%{opacity:0;transform:scaleX(1.6) translateX(-30%)}}
.fsplash{position:absolute;height:12px;margin:-6px 0 0;transform:translateX(-50%);border-radius:50%;border:2.5px solid rgba(255,255,255,.9);pointer-events:none;z-index:2;animation:fspl .9s ease-out forwards}
@keyframes fspl{0%{opacity:.9;transform:translateX(-50%) scale(.4)}100%{opacity:0;transform:translateX(-50%) scale(1.25)}}
.fclone{pointer-events:none}
.fclone .seats{opacity:1}

@media (max-height:700px){
 #app #sea{height:calc(clamp(92px,15vh,170px) + 56px + var(--sat,env(safe-area-inset-top)))!important}
 #app #ferry.sprf{--fh:calc(clamp(92px,15vh,170px)*1.02)}
 #app .slot{flex:0 1 46px!important}
 #app #benchwrap{padding-top:calc(min(100vw,480px)*.14)!important;padding-bottom:5px!important}
 #app #bcnt{top:calc(min(100vw,480px)*.14 - 23px)!important}
 #app .bst .ic{width:46px!important;height:46px!important}
 #app .bst{font-size:11px!important;gap:3px}
 #boosters{padding-top:4px!important}
}

/* v0.72 kazanma ekranı */
#card .stars3 i{transition:none!important;opacity:.35;filter:grayscale(1) brightness(1.15)!important;transform:scale(.8)}
#card .stars3 i.on{opacity:1;filter:drop-shadow(0 4px 4px rgba(150,90,0,.35))!important;animation:starSlam .5s cubic-bezier(.25,1.4,.5,1) both}
@keyframes starSlam{0%{transform:scale(2.6) rotate(-35deg);opacity:0}55%{transform:scale(.86) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#card .stars3 i:nth-child(2).on{animation-name:starSlam2}
@keyframes starSlam2{0%{transform:scale(3) rotate(25deg);opacity:0}55%{transform:scale(.92) rotate(-5deg);opacity:1}100%{transform:scale(1.12) rotate(0)}}
.stars3::before{animation:rays 9s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.spk2{position:absolute;width:9px;height:9px;z-index:200;pointer-events:none;background:radial-gradient(circle,#fff 0 30%,#ffd84d 45%,rgba(255,200,40,0) 70%);border-radius:50%}
.rfly{position:absolute;width:30px;height:30px;z-index:300;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
#card .reward .rcnt{display:inline-block;min-width:1.6em;text-align:right}

/* v0.73 kıl payı ekranı */
.nmiss{margin:2px 0 10px;text-align:center}
.nmiss b{display:block;font-family:'Lilita One','Fredoka',sans-serif;font-weight:400;font-size:17px;color:#c8302a;margin-bottom:6px}
.nmiss i{display:block;height:12px;border-radius:8px;background:#e3cfa6;box-shadow:inset 0 1px 3px rgba(90,60,30,.4);overflow:hidden;margin:0 10px}
.nmiss u{display:block;height:100%;border-radius:8px;background:linear-gradient(#9fe36a,#4fb83a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* v0.74 sis dağılması + genel geçişler */
.rfsp{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:8;pointer-events:none;background:radial-gradient(circle,#fff 0 25%,#fff3b0 45%,rgba(255,230,140,0) 70%);border-radius:50%}
#menu .tab.on{animation:tabIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#menu .tab.on.noanim{animation:none}
.fig.pin{animation:figIn .38s cubic-bezier(.25,1.4,.5,1) both}
@keyframes figIn{from{opacity:0;scale:.2;translate:0 -18px}to{opacity:1;scale:1;translate:0 0}}
#app.lvin #ferry{animation:none}

/* ===== v0.75 RESTORASYON ŞÖLENİ ===== */
.rs2{gap:10px!important}
.rs{position:relative;margin:-6px -12px 0;height:clamp(190px,31vh,320px);overflow:hidden;background:#2a8fb4;isolation:isolate;-webkit-mask:linear-gradient(#000 88%,transparent);mask:linear-gradient(#000 88%,transparent)}
.rsimg{position:absolute;inset:-4%;animation:rsKB 18s ease-in-out infinite alternate}
@keyframes rsKB{from{transform:scale(1) translate(0,0)}to{transform:scale(1.05) translate(-1%,-1%)}}
.rsi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;transition:filter 1.6s ease}
.rsi.nw{z-index:1}
.rs[data-st="0"] .rsi{filter:saturate(.35) brightness(.82) contrast(.95) hue-rotate(-8deg)}
.rs[data-st="1"] .rsi{filter:saturate(.7) brightness(.92)}
.rs[data-st="2"] .rsi{filter:saturate(.95) brightness(1)}
.rs[data-st="3"] .rsi{filter:saturate(1.15) brightness(1.04) contrast(1.03)}
.rs>i,.rs>div,.rs>svg{pointer-events:none}
.rs-vig{position:absolute;inset:0;z-index:5;transition:opacity 1.6s;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(10,30,50,.45))}
.rs[data-st="0"] .rs-vig{background:radial-gradient(ellipse at 50% 55%,transparent 35%,rgba(20,25,40,.65))}
.rs[data-st="3"] .rs-vig{opacity:.4}
.rs-cl{position:absolute;left:0;right:0;top:0;height:40%;z-index:3;transition:opacity 1.6s}
.rs-cl>i{position:absolute;display:block;width:42%;height:60%;animation:rsCl 24s ease-in-out infinite alternate}
.rs-cl>i b{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 45% 35%,#9aa5b3 0 40%,#7a8697 62%,rgba(110,122,138,0) 72%)}
.rs-cl>i b:nth-child(1){left:0;top:30%;width:45%;height:60%}.rs-cl>i b:nth-child(2){left:25%;top:0;width:55%;height:85%}.rs-cl>i b:nth-child(3){left:58%;top:25%;width:42%;height:62%}
.rs-cl .c0{left:-6%;top:-12%}.rs-cl .c1{left:34%;top:-22%;animation-duration:30s;animation-direction:alternate-reverse}.rs-cl .c2{left:68%;top:-8%;animation-duration:27s}
@keyframes rsCl{from{transform:translateX(-6%)}to{transform:translateX(8%)}}
.rs[data-st="1"] .rs-cl{opacity:.55}.rs[data-st="1"] .rs-cl>i b{background:radial-gradient(ellipse at 45% 35%,#e9eef3 0 40%,#c6d0da 62%,rgba(200,210,220,0) 72%)}
.rs[data-st="2"] .rs-cl{opacity:.35}.rs[data-st="2"] .rs-cl>i b,.rs[data-st="3"] .rs-cl>i b{background:radial-gradient(ellipse at 45% 35%,#fff 0 42%,#eef6fb 62%,rgba(238,246,251,0) 72%)}
.rs[data-st="3"] .rs-cl{opacity:.25}
.rs-rain{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity 1.2s;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(200,220,240,.38) 9px 10.5px);background-size:40px 40px;animation:rrain .55s linear infinite}
.rs[data-st="0"] .rs-rain{opacity:.7}
.rs-sun{position:absolute;right:-18%;top:-30%;width:75%;aspect-ratio:1;border-radius:50%;z-index:2;opacity:0;transition:opacity 1.8s;background:radial-gradient(circle,rgba(255,240,190,.95),rgba(255,210,120,.45) 35%,rgba(255,200,100,0) 70%);mix-blend-mode:screen}
.rs[data-st="2"] .rs-sun{opacity:.55}.rs[data-st="3"] .rs-sun{opacity:1}
.rs-rays{position:absolute;right:-30%;top:-60%;width:120%;aspect-ratio:1;z-index:2;opacity:0;transition:opacity 1.8s;background:repeating-conic-gradient(rgba(255,235,170,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:rays 40s linear infinite;mix-blend-mode:screen}
.rs[data-st="3"] .rs-rays{opacity:1}
.rs-gull{position:absolute;width:46px;top:22%;left:-60px;z-index:4;opacity:0;transition:opacity 1s;animation:rsGull 14s linear infinite}
.rs[data-st="2"] .rs-gull,.rs[data-st="3"] .rs-gull{opacity:1}
@keyframes rsGull{from{transform:translate(0,0)}50%{transform:translate(55vw,-14px)}to{transform:translate(min(110vw,520px),6px)}}
.rs-gull path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:dflap .45s ease-in-out infinite alternate}
.rs-spk{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity 1.4s}
.rs[data-st="3"] .rs-spk{opacity:1}
.rs-spk b{position:absolute;width:12px;height:12px;background:radial-gradient(circle,#fff 0 20%,#fff1a8 40%,rgba(255,230,140,0) 70%);animation:rsTw 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes rsTw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}}

 Üsküdar'a kadar uçtuğu anlatılır.": "Built by the Genoese in 1348. In the 17th century, Hezarfen Ahmed Çelebi is said to have jumped from this tower with homemade wings and glided all the way to Üsküdar.", "Haydarpaşa Garı": "Haydarpaşa Station", "Kadıköy'ün tarihi garı": "Kadıköy's historic station", "1908'de açıldı ve Alman mimarlar tarafından tasarlandı. Anadolu'ya giden trenlerin başladığı yerdi. Binanın temeli denize çakılmış binlerce ahşap kazığın üzerinde duruyor.": "Opened in 1908 and designed by German architects, it was where trains to Anatolia began their journey. The building stands on thousands of wooden piles driven into the sea.", "Dolmabahçe Saat Kulesi": "Dolmabahçe Clock Tower", "Beşiktaş'ta zarif saat": "An elegant clock in Beşiktaş", "Sultan II. Abdülhamid döneminde, 1890'larda yapıldı. Mimarı Sarkis Balyan'dır. Dört yüzünde de saat bulunan kule, sarayın bahçesinde Boğaz'a bakar.": "Built in the 1890s during the reign of Sultan Abdülhamid II and designed by Sarkis Balyan. The tower has a clock on all four sides and overlooks the Bosphorus from the palace gardens.", "Ortaköy Camii": "Ortaköy Mosque", "Köprünün dibindeki inci": "A pearl beneath the bridge", "Asıl adı Büyük Mecidiye Camii. 1850'lerde Sultan Abdülmecid için Balyan ailesinden mimarlar tarafından yapıldı. Deniz kenarındaki konumuyla İstanbul'un en çok fotoğraflanan yapılarından biri.": "Its official name is the Grand Mecidiye Mosque. It was built in the 1850s for Sultan Abdülmecid by architects of the Balyan family. Its waterfront setting makes it one of Istanbul's most photographed buildings.", "Rumeli Hisarı": "Rumeli Fortress", "Boğaz'ı bekleyen kale": "The fortress guarding the strait", "Fatih Sultan Mehmet tarafından 1452'de, İstanbul'un fethinden önce Boğaz'ı kontrol etmek için yaklaşık dört ayda inşa edildi. Karşısında Anadolu Hisarı bulunur.": "Built by Sultan Mehmed II in 1452 in about four months, to control the Bosphorus before the conquest of Istanbul. Anadolu Fortress stands across the water.", "Boğaziçi Köprüsü": "Bosphorus Bridge", "İki kıtayı birleştiren": "Linking two continents", "1973'te açıldı ve Avrupa ile Asya'yı birbirine bağlayan ilk köprü oldu. Açıldığında dünyanın en uzun asma köprülerinden biriydi. Geceleri renkli ışıklarla aydınlanır.": "Opened in 1973 as the first bridge to connect Europe and Asia. At the time it was one of the longest suspension bridges in the world. At night it glows with colourful lights.", "Ayasofya": "Hagia Sophia", "Sultanahmet'in kalbi": "The heart of Sultanahmet", "537 yılında Bizans İmparatoru I. Justinianus döneminde tamamlandı. Yaklaşık bin yıl boyunca dünyanın en büyük kubbeli yapısı olarak kaldı ve mimarlık tarihini derinden etkiledi.": "Completed in 537 under the Byzantine Emperor Justinian I. For nearly a thousand years it was the largest domed building in the world, and it deeply influenced the history of architecture.", "Kayalıkları temizle": "Clear the rocks", "Kuleyi onar ve boya": "Repair and paint the tower", "Feneri yak, terası süsle": "Light the lamp, decorate the terrace", "Sokakları temizle": "Clean the streets", "Taşları onar": "Repair the stones", "Seyir terasını süsle": "Decorate the viewing deck", "Peronu temizle": "Clean the platform", "Cepheyi yenile": "Restore the facade", "Garı ışıklandır": "Light up the station", "Bahçeyi temizle": "Clean the garden", "Saati tamir et": "Fix the clock", "Çiçeklerle süsle": "Decorate with flowers", "Meydanı temizle": "Clean the square", "Kubbeyi onar": "Repair the dome", "Sahili ışıklandır": "Light up the waterfront", "Surları temizle": "Clean the walls", "Kuleleri onar": "Repair the towers", "Kuleleri ışıklandır": "Light up the towers", "Kabloları temizle": "Clean the cables", "Ayakları boya": "Paint the towers", "Köprüyü ışıklandır": "Light up the bridge", "Avluyu temizle": "Clean the courtyard", "Meydanı süsle": "Decorate the square", "Rialto Köprüsü": "Rialto Bridge", "Büyük Kanal'ın taş köprüsü": "The stone bridge of the Grand Canal", "Venedik'in Büyük Kanal üzerindeki en eski köprüsü. Bugünkü taş hali 1591'de tamamlandı. Üzerinde iki sıra dükkân bulunur.": "The oldest bridge across Venice's Grand Canal. Its current stone form was completed in 1591, and it carries two rows of shops.", "San Marco Çan Kulesi": "St Mark's Campanile", "Meydanın kırmızı bekçisi": "The red guardian of the square", "San Marco Meydanı'ndaki 99 metrelik çan kulesi 1902'de aniden çöktü. On yıl sonra, 1912'de \"olduğu yerde, olduğu gibi\" sözüyle birebir aynı şekilde yeniden yapıldı.": "The 99-metre bell tower in St Mark's Square suddenly collapsed in 1902. Ten years later, in 1912, it was rebuilt exactly as before under the motto \"where it was, as it was\".", "Doçlar Sarayı": "Doge's Palace", "Cumhuriyetin pembe sarayı": "The pink palace of the Republic", "Yüzyıllar boyunca Venedik Cumhuriyeti'nin yönetim merkezi oldu. Pembe-beyaz desenli cephesiyle Gotik mimarinin en tanınmış örneklerinden biridir.": "For centuries it was the seat of government of the Venetian Republic. With its pink and white patterned facade it is one of the best-known examples of Gothic architecture.", "Ah Köprüsü": "Bridge of Sighs", "Kanal üstündeki kapalı köprü": "An enclosed bridge over the canal", "Doçlar Sarayı'nı eski hapishaneye bağlar. Anlatılana göre mahkûmlar bu köprüden geçerken pencereden Venedik'i son kez görüp iç çekerdi. Köprüye bu adı İngiliz şair Lord Byron kazandırdı.": "It links the Doge's Palace to the old prison. The story goes that prisoners sighed at their last view of Venice through its windows. The English poet Lord Byron made the name famous.", "Salute Kilisesi": "Santa Maria della Salute", "Kanal ağzındaki beyaz kubbe": "The white dome at the canal's mouth", "1630'daki büyük veba salgını sona erdiğinde şükran için yapımına başlandı ve 1687'de tamamlandı. Büyük Kanal'ın girişindeki beyaz kubbesi Venedik'in simgelerinden biridir.": "Construction began as a thanksgiving when the great plague of 1630 ended, and it was completed in 1687. Its white dome at the entrance of the Grand Canal is a symbol of Venice.", "Burano Evleri": "Burano Houses", "Rengârenk balıkçı adası": "The colourful fishing island", "Burano adasındaki evler cıvıl cıvıl renklere boyanır. Anlatılana göre balıkçılar sisli havalarda kendi evlerini denizden kolayca bulabilmek için evlerini böyle boyamış.": "The houses on Burano are painted in bright colours. It is said fishermen painted them this way so they could find their own homes from the sea on foggy days.", "Murano Cam Atölyesi": "Murano Glassworks", "Cam ustalarının adası": "The island of glassmakers", "1291'de Venedik'teki cam atölyeleri yangın tehlikesi yüzünden Murano adasına taşındı. O günden beri ada, ustaların üflediği renkli camlarıyla dünyaca ünlü.": "In 1291 Venice's glass workshops were moved to Murano because of the fire risk. Ever since, the island has been world-famous for its colourful hand-blown glass.", "Gondol Tersanesi": "Gondola Boatyard", "Gondolların doğduğu yer": "Where gondolas are born", "Gondollar hâlâ geleneksel \"squero\" denen tersanelerde elle yapılır. Hepsinin siyah olmasının sebebi, 16. yüzyılda çıkarılan ve aşırı süslemeyi yasaklayan kanunlardır.": "Gondolas are still built by hand in traditional boatyards called \"squeri\". They are all black because of 16th-century laws that banned excessive decoration.", "Kanalı temizle": "Clean the canal", "Kemeri onar": "Repair the arch", "Dükkânları süsle": "Decorate the shops", "Molozları kaldır": "Clear the rubble", "Kuleyi yeniden ör": "Rebuild the tower", "Çanları as": "Hang the bells", "Rıhtımı temizle": "Clean the quay", "Sarayı ışıklandır": "Light up the palace", "Fenerleri yak": "Light the lanterns", "Basamakları temizle": "Clean the steps", "Kiliseyi ışıklandır": "Light up the church", "Evleri boya": "Paint the houses", "Atölyeyi temizle": "Clean the workshop", "Fırını onar": "Repair the furnace", "Camları sergile": "Display the glass", "Kızağı temizle": "Clean the slipway", "Tersan mpty. Board the ferry's colour first and only send other colours to wait when you need to clear a path.", "Gri <b>?</b> yolcuların rengi gizli. Önleri açılınca renkleri ortaya çıkar 👀": "Grey <b>?</b> passengers hide their colour. It is revealed when their path opens 👀", "Dikkat! Bu bölümde bekleme alanı <b>4 kişilik</b>. Hamlelerini daha dikkatli planla.": "Careful! In this level the waiting area has only <b>4 seats</b>. Plan your moves more carefully.", "🚧 <b>Yeni: Engeller!</b> Bariyer, bavul ve kasaların olduğu yerlerden yolcular geçemez. Yolları daraltırlar, hamlelerini ona göre planla.": "🚧 <b>New: Obstacles!</b> Passengers can't pass through barriers, suitcases and crates. They narrow the paths, so plan accordingly.", "🔒 <b>Yeni: Kilitli yolcular!</b> Zincirli yolcu, önü açık olsa bile hareket edemez.": "🔒 <b>New: Locked passengers!</b> A chained passenger can't move even if the path is open.", "🔑 Aynı renk halkalı <b>anahtarlı yolcuyu</b> vapura ya da bekleme alanına gönderince kilit açılır.": "🔑 Send the <b>key passenger</b> with the matching ring to a ferry or the waiting area to unlock it.", "🌫️ <b>Yeni: Sis!</b> Bu bölümde sıradaki vapurlardan sadece birini görebilirsin. Bekleme alanını boş tutmaya çalış.": "🌫️ <b>New: Fog!</b> In this level you can only see one upcoming ferry. Try to keep the waiting area empty.", "<div class=\"em\">↻</div><h2>Baştan başla?</h2><p>Bölümü yeniden başlatırsan 💔 1 can kaybedersin. (Kalan: ": "<div class=\"em\">↻</div><h2>Restart?</h2><p>Restarting the level costs 💔 1 life. (Left: ", ")</p><button class=\"btn gold\" id=\"rsY\">Evet, baştan başla</button><button class=\"btn alt\" id=\"rsN\">Vazgeç</button>": ")</p><button class=\"btn gold\" id=\"rsY\">Yes, restart</button><button class=\"btn alt\" id=\"rsN\">Cancel</button>", "🧪 Test: bölüm geçildi": "🧪 Test: level skipped", "</div><textarea id=\"fbm\" class=\"fbm\" placeholder=\"Ne hoşuna gitti, ne zorladı, ne eksik? (Zorluk, görseller, sesler...)\"></textarea><button class ata-c=\"1500\"><span>Sack of coins · Best</span><b>1500 🪙</b><i>$4.99</i></button>", "<button class=\"pack\" data-c=\"40\" data-ad=\"1\"><span>📺 Reklam izle</span><b>+40 🪙</b><i>Ücretsiz · ": "<button class=\"pack\" data-c=\"40\" data-ad=\"1\"><span>📺 Watch an ad</span><b>+40 🪙</b><i>Free · ", "<button class=\"pack\" data-c=\"500\"><span>Bir avuç altın</span><b>500 🪙</b><i>₺49,99</i></button>": "<button class=\"pack\" data-c=\"500\"><span>Handful of coins</span><b>500 🪙</b><i>$1.99</i></button>", "<button class=\"pack\" data-noads=\"1\"><span>Reklamsız oyun</span><b>🚫📺</b><i>₺89,99</i></button>": "<button class=\"pack\" data-noads=\"1\"><span>No ads</span><b>🚫📺</b><i>$2.99</i></button>", "<p>Devam edersen +1 bekleme yeriyle kaldığın yerden sürersin. Vazgeçersen 💔 1 can gider.</p><button class=\"btn gold\" id=\"mCoin\">Devam et · 🪙": "<p>Continue to keep going from here with +1 waiting seat. If you give up, you lose 💔 1 life.</p><button class=\"btn gold\" id=\"mCoin\">Continue · 🪙", "Ahşabı onar": "Repair the wood", "Amstel üzerindeki açılır köprü": "The drawbridge over the Amstel", "Amsterdam kanallarında yaklaşık 2.500 ev teknesi var. Konut sıkıntısı yüzünden İkinci Dünya Savaşı'ndan sonra eski yük gemileri eve dönüştürülmeye başlandı.": "There are about 2,500 houseboats on Amsterdam's canals. After World War II, a housing shortage led people to turn old cargo ships into homes.", "Bekleme alanı ": "Waiting area ", "Bir zamanlar şehir surlarının kapısıydı. 17. yüzyılda kısa bir süre burada para basıldığı için adını aldı. Tepesindeki çanlar her 15 dakikada bir melodi çalar.": "It was once a gate in the city walls. It got its name because coins were briefly minted here in the 17th century. The bells at the top play a tune every 15 minutes.", "Cepheleri boya": "Paint the facades", "Dar cepheli tüccar evleri": "Narrow merchant houses", "Darphane Kulesi": "Mint Tower", "Değirmeni döndür": "Turn the mill", "Duvarları ör": "Rebuild the walls", "Eski şehir kapısının saat kulesi": "Clock tower of the old city gate", "Ev Tekneleri": "Houseboats", "Gövdeleri boya": "Paint the hulls", "Hollanda'nın en yüksek ahşap yel değirmeni, boyu 26,6 metre. 1814'ten beri bugünkü yerinde duruyor ve kanatları hâlâ dönebiliyor.": "The tallest wooden windmill in the Netherlands, 26.6 metres high. It has stood on its current spot since 1814, and its sails can still turn.", "Işıkları tak": "Hang the lights", "Kanal Evleri": "Canal Houses", "Kanal kıyısındaki evler çok dar yapılırdı, çünkü eskiden vergi cephe genişliğine göre alınırdı. Çatılardaki kancalarla eşyalar halatla pencereden içeri çekilir.": "Canal houses were built very narrow because taxes used to be based on the width of the facade. Furniture is hoisted in through the windows with ropes and the hooks on the roofs.", "Kanalda yüzen çiçek pazarı": "A flower market floating on the canal", "Kanallarda yüzen evler": "Homes floating on the canals", "Kanalların üstüne kurulu istasyon": "A station built over the water", "Kanatları onar": "Repair the sails", "Kapıları aç": "Open the doors", "Köprüyü boya": "Paint the bridge", "Laleleri diz": "Arrange the tulips", "Merkez İstasyonu": "Central Station", "Pencereleri tak": "Fit the windows", "Peronu süsle": "Decorate the platform", "Rayları temizle": "Clean the tracks", "Ressamların büyük sarayı": "Home of the Dutch masters", "Rijksmuseum": "Rijksmuseum", "Saat kulelerini onar": "Repair the clock towers", "Saati onar": "Fix the clock", "Son vapur!": "Last ferry!", "Tekneleri bağla": "Moor the boats", "Temeli sağlamlaştır": "Strengthen the foundation", "Tezgâhları kur": "Set up the stalls", "Yel Değirmeni": "Windmill", "Zayıf Köprü": "Skinny Bridge", "Zor": "Hard", "Çiçek Pazarı": "Flower Market", "Çiçek saksılarını as": "Hang the flower pots", "Çiçekleri ek": "Plant the flowers", "Çok Zor": "Very Hard", "İlk hali 1691'de yapıldı, bugünkü beyaz ahşap köprü 1934'ten kalma. Tekneler geçerken hâlâ açılır; geceleri yüzlerce ampulle ışıl ışıl parlar.": "The firs
